# Cargo config for the AFT workspace.
#
# Lowers debug info from full DWARF to line tables only, which:
#   - Preserves panic backtraces with file:line + function names
#   - Preserves `dbg!()`, `tracing`/`log` file:line, profiler symbols
#   - Drops variable inspection in step-through debuggers (lldb/gdb)
#
# Disk impact: ~50-70% smaller rlib/binary sizes in target/debug.
# Compile impact: slightly faster link time, no codegen slowdown.
#
# If you need full variable inspection in lldb for a tricky issue, run with
# RUSTFLAGS="-C debuginfo=2" cargo test ... for that session.

# Incremental compilation is left at Cargo's default: on for the dev and test
# profiles, off for release. Only workspace crates build incrementally;
# dependencies never do, so sccache (opt-in via `RUSTC_WRAPPER=sccache`, see
# README) still caches them. An edit to agent-file-tools then recompiles only
# what changed instead of the whole crate.
#
# Incremental state lives in target/<profile>/incremental and grows over a long
# session; `cargo clean -p agent-file-tools` or deleting that folder reclaims
# it. CI builds from scratch every run, so its workflows set
# CARGO_INCREMENTAL=0 themselves.
#
# sccache is not a committed `[build] rustc-wrapper` because a committed
# wrapper propagates into the Docker-based `cross` release builds, where
# sccache isn't installed.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
