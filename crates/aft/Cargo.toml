[package]
name = "agent-file-tools"
version = "0.63.1"
edition = "2021"
description = "Agent File Tools — tree-sitter powered code analysis for AI agents"
license = "MIT"
repository = "https://github.com/cortexkit/aft"
keywords = ["tree-sitter", "code-analysis", "ai-agent", "ast"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
rust-version.workspace = true
# Aggregate integration suites avoid linking one executable per source file.
# Explicit targets leave fixture/descriptor paths stable without autodiscovery.
autotests = false

[lib]
name = "aft"
path = "src/lib.rs"

[[bin]]
name = "aft"
path = "src/main.rs"

[[test]]
name = "engine"
path = "tests/engine/main.rs"

[[test]]
name = "list_envelope"
path = "tests/list_envelope/main.rs"

[[test]]
name = "semantic"
path = "tests/semantic/main.rs"

[[test]]
name = "alert"
path = "tests/alert/main.rs"

[[test]]
name = "rest"
path = "tests/rest/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# Live watchers must not share a harness with unrelated process-heavy tests.
[[test]]
name = "watcher_integration"
path = "tests/watcher_integration/main.rs"

# CI runs sandbox probes single-threaded with mandatory Landlock on Linux.
[[test]]
name = "sandbox_launch_probe"
path = "tests/sandbox_launch_probe.rs"

# A stamped worker's shell under the real native sandbox (macOS only): a
# separate binary so it can be built and run on its own on the Mac.
[[test]]
name = "worker_jail"
path = "tests/worker_jail.rs"

# The semantic wrapper changes process cwd; keep it out of the shared harness.
[[test]]
name = "semantic_test"
path = "tests/semantic_test.rs"

# Counting allocators measure the entire process heap, so unrelated tests would
# contaminate their working-set bounds even with a shared allocator implementation.
[[test]]
name = "semantic_embed_working_set_test"
path = "tests/semantic_embed_working_set_test.rs"

[[test]]
name = "semantic_embed_overflow_recovery_working_set_test"
path = "tests/semantic_embed_overflow_recovery_working_set_test.rs"

# Ignored macOS heap probes also need an uncontaminated process-wide allocator.
[[test]]
name = "daemon_malloc_small_growth_repro"
path = "tests/daemon_malloc_small_growth_repro.rs"

# The walk cost probe counts process-wide allocations in an isolated harness.
[[test]]
name = "applicability_cost"
path = "tests/applicability_cost.rs"

# The cold trigram build's peak heap is counted process-wide by its own
# allocator, so it needs a binary of its own.
[[test]]
name = "search_index_build_memory"
path = "tests/search_index_build_memory.rs"

[lints.rust]
# The ignored navigation profile is enabled explicitly for manual measurements.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aft_views_lazy_benchmark)', 'cfg(aft_fake_lsp_helper)'] }

[features]
# Explicit opt-in for cross-process timing controls used by integration tests.
test-timing-hooks = []
# In-process integration fixtures need the real binary for native re-exec.
test-sandbox-launcher = []
# Deterministic producer inputs for real-wire conformance fixtures, never production.
test-conformance-result-inputs = []
# Compiles the test-only secret vault (V5). Nothing in the product reads it:
# a release profile must never enable it, and
# `scripts/check-secret-test-fake.sh` fails CI when one does.
secret-test-fake = []
semantic-chunk-census = []

[dependencies]
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
apollo-parser = "0.8.6"
lsp-types = "0.97"
crossbeam-channel = "0.5"
parking_lot = "0.12"
portable-pty = "0.9"
libc = "0.2"
getrandom = "0.3"
tree-sitter = "0.26"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-cuda = "0.21.1"
tree-sitter-zig = "1.1"
tree-sitter-c-sharp = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-html = "0.23"
tree-sitter-md = "0.5"
tree-sitter-solidity = "1.2"
tree-sitter-vue = { package = "tree-sitter-vue-next", version = "0.1" }
tree-sitter-json = "0.24"
tree-sitter-toml = { package = "tree-sitter-toml-ng", version = "0.7.0" }
tree-sitter-scala = "0.26"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-swift = "0.7.4"
tree-sitter-php = "0.24"
tree-sitter-lua = "0.5"
# `ts-parser-perl` is the crate for github.com/tree-sitter-perl/tree-sitter-perl,
# a substantially more accurate Perl grammar. The `package =` rename keeps the
# `tree_sitter_perl` path working unchanged.
tree-sitter-perl = { package = "ts-parser-perl", version = "1.1" }
tree-sitter-pascal = "0.10.2"
tree-sitter-r = "1.2.0"
tree-sitter-objc = "3.0.2"
tree-sitter-yaml = "0.7"
dekobon-tree-sitter-groovy = "0.2.2"
similar = "2"
ast-grep-core = "0.41"
streaming-iterator = "0.1"
ignore = "0.4"
notify = "8"
regex = "1"
regex-syntax = "0.8"
toml = { version = "0.8", default-features = false, features = ["parse"] }
globset = "0.4"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["compress"] }
crc32fast = "1"
blake3 = "1"
oxc_allocator = "0.126"
oxc_ast = "0.126"
oxc_ast_visit = "0.126"
oxc_parser = "0.126"
oxc_resolver = "11"
oxc_semantic = "0.126"
oxc_span = "0.126"
oxc_str = "0.126"
rustc-hash = "2"
rustc-demangle = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "trace", "functions"] }
aft-tokenizer = { path = "../aft-tokenizer", version = "0.63.1" }
# The placeholder grammar, key-location rules and audit record AFT's vault
# seam speaks. AFT owns the crate; basal links it later.
secret-rules = { path = "../secret-rules", version = "0.1.0" }
zeroize = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli"] }
rcgen = "0.13"
# Shared CortexKit-neutral path-canonicalization primitive (ProjectRootId).
# Lives in github.com/cortexkit/commons (product-neutral, used without subc);
# its CI runs the cfg(windows) verbatim/UNC/drive-case vectors continuously.
cortexkit-paths = "0.1"
cortexkit-exec-remote-types = "=0.2.14"

glob = "0.3"
which = "7"
url = "2"
unicode-normalization = "0.1"
content_inspector = "0.2.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
memchr = "2"
rayon = "1"
# Use rustls-platform-verifier for per-connection OS trust checks instead of
# enumerating native roots while every reqwest client is built.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# The connector layer reqwest accepts is a tower layer; the URL fetcher wraps
# connection setup with one to tell a stalled connect from a silent server.
# Both crates are already in the tree through reqwest.
tower-layer = "0.3"
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.6"
# Verify fleet-served gh routing manifests with a public-key signature before
# they can authorise governed routing.
ring = "0.17"
tree-sitter-scss = { package = "cortexkit-tree-sitter-scss", version = "1.0.1" }
# Local embedding backend (all-MiniLM-L6-v2) driven directly through ort, so we
# control intra-op thread count (fastembed hardcoded all-cores). hf-hub fetches
# the model on fresh installs; ureq feature = sync + rustls (no native-tls, for
# clean cross-platform builds).
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["ndarray", "load-dynamic", "half"] }
# We only load tokenizer.json and encode; serde/json support is always-on in
# tokenizers. The pure-Rust fancy-regex backend satisfies tokenizers
# compile-time regex selection without pulling in onig's C library.
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
ndarray = "0.17.2"
half = "2"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
htmd = "0.5.4"
# The DOM type behind htmd's `Element::node`; keep the major in lockstep with
# htmd so the URL fetcher can read <pre> text nodes verbatim.
markup5ever_rcdom = "0.38"
# Keep protocol and transport pinned in lockstep: the transport Frame codec and
# the protocol's control bodies must agree on the wire-v2 epoch envelope. Tokio
# runs only at the --subc transport edge; AFT's command core stays synchronous.
cortexkit-role-tool-provider = "=0.13.0"
cortexkit-role-agent-data = "=0.2.3"
cortexkit-project-identity = "=0.1.4"
cortexkit-agent-identity = "=0.1.1"
jsonschema = { version = "0.33", default-features = false }
subc-protocol = "=0.33.3"
subc-transport = "=0.14.0"
subc-client-rs = "=0.32.7"
# The one reader of the daemon's launch nonce (pipe first, environment copy
# second). subc-client-rs reads through the same cached accessor, so this pin
# must match the version subc-client-rs depends on.
subc-os = "=0.1.18"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
vt100 = "0.16"
jsonc-parser = { version = "0.33", features = ["cst"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.5"

[target.'cfg(target_os = "macos")'.dependencies]
fsevent-sys = "4.1"
libproc = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_UI_Shell",
] }

[dev-dependencies]
# Enable the launcher seam only in test builds, not ordinary aft binaries.
agent-file-tools = { path = ".", features = ["test-sandbox-launcher", "test-conformance-result-inputs"] }
graphql-parser = "0.4.1"
cortexkit-role-tool-provider-conformance = "=0.13.1"
cortexkit-role-agent-data = { version = "=0.2.3", features = ["test-vectors"] }
cortexkit-role-harness = "=0.1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
filetime = "0.2"
