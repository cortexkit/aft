[package]
name = "agent-file-tools"
version = "0.66.0"
edition = "2021"
default-run = "aft"
description = "Agent Foundational Toolkit — tree-sitter powered code analysis for AI agents"
license = "MIT"
repository = "https://github.com/cortexkit/aft"
keywords = ["tree-sitter", "code-analysis", "ai-agent", "ast"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
rust-version.workspace = true
# crates.io refuses uploads over 10 MiB. Integration suites and their fixtures
# are only needed in this repository, so they stay out of the published crate;
# the release workflow's packaging check guards the limit.
# Examples are measurement probes and gates for this repository, and their data
# packs alone exceed crates.io's 10 MiB crate limit, so they stay out of the
# published crate.
exclude = ["tests/", "examples/", "src/**/*_tests.rs", "src/**/tests.rs", "src/**/tests/"]
# Aggregate integration suites avoid linking one executable per source file.
# Explicit targets leave fixture/descriptor paths stable without autodiscovery.
autotests = false

[lib]
name = "aft"
path = "src/lib.rs"

[[bin]]
name = "aft"
path = "src/main.rs"

[[example]]
name = "grammar_hardened_smoke"
required-features = ["wasm-grammars"]

[[example]]
name = "callgraph_exactness"
required-features = ["test-hooks"]

[[bin]]
name = "aft-test-scope-owner"
path = "tests/helpers/scope_owner.rs"
required-features = ["test-scope-owner"]

[[test]]
name = "engine"
path = "tests/engine/main.rs"

[[test]]
name = "list_envelope"
path = "tests/list_envelope/main.rs"

[[test]]
name = "semantic"
path = "tests/semantic/main.rs"

[[test]]
name = "alert"
path = "tests/alert/main.rs"

[[test]]
name = "rest"
path = "tests/rest/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# Live watchers must not share a harness with unrelated process-heavy tests.
[[test]]
name = "watcher_integration"
path = "tests/watcher_integration/main.rs"

# CI runs sandbox probes single-threaded with mandatory Landlock on Linux.
[[test]]
name = "sandbox_launch_probe"
path = "tests/sandbox_launch_probe.rs"

# A stamped worker's shell under the real native sandbox (macOS only): a
# separate binary so it can be built and run on its own on the Mac.
[[test]]
name = "worker_jail"
path = "tests/worker_jail.rs"

# The semantic wrapper changes process cwd; keep it out of the shared harness.
[[test]]
name = "semantic_test"
path = "tests/semantic_test.rs"

# Counting allocators measure the entire process heap, so unrelated tests would
# contaminate their working-set bounds even with a shared allocator implementation.
[[test]]
name = "semantic_embed_working_set_test"
path = "tests/semantic_embed_working_set_test.rs"

[[test]]
name = "semantic_embed_overflow_recovery_working_set_test"
path = "tests/semantic_embed_overflow_recovery_working_set_test.rs"

# Ignored macOS heap probes also need an uncontaminated process-wide allocator.
[[test]]
name = "daemon_malloc_small_growth_repro"
path = "tests/daemon_malloc_small_growth_repro.rs"

# The walk cost probe counts process-wide allocations in an isolated harness.
[[test]]
name = "applicability_cost"
path = "tests/applicability_cost.rs"

[lints.rust]
# The ignored navigation profile is enabled explicitly for manual measurements.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aft_views_lazy_benchmark)', 'cfg(aft_fake_lsp_helper)'] }

[features]
# Source builds need CMake 3.18+ only when downloaded grammars are enabled.
wasm-grammars = ["aft-engine/wasm-grammars", "aft-tools/wasm-grammars"]
# Offline call-graph measurements only; never enabled by production builds.
callgraph-shape-census = ["aft-engine/callgraph-shape-census", "aft-base/callgraph-shape-census", "aft-parse/callgraph-shape-census"]
test-scope-owner = ["aft-subc/test-runner-notice-fixtures"]
# Explicit opt-in for cross-process timing controls used by integration tests.
test-timing-hooks = ["aft-engine/test-timing-hooks", "aft-base/test-timing-hooks", "aft-db/test-timing-hooks", "aft-parse/test-timing-hooks", "aft-tools/test-timing-hooks", "aft-subc/test-timing-hooks"]
# Opt-in integration hooks for native re-exec and deterministic conformance inputs;
# never enable these hooks in production builds.
test-hooks = ["aft-engine/test-hooks", "aft-engine/test-support", "aft-base/test-hooks", "aft-base/test-support", "aft-db/test-hooks", "aft-db/test-support", "aft-parse/test-hooks", "aft-parse/test-support", "aft-tools/test-hooks", "aft-subc/test-hooks"]
test-support = ["aft-engine/test-support", "aft-base/test-support"]
# Compiles the test-only secret vault (V5). Nothing in the product reads it:
# a release profile must never enable it, and
# `scripts/check-secret-test-fake.sh` fails CI when one does.
secret-test-fake = ["aft-engine/secret-test-fake", "aft-base/secret-test-fake"]
semantic-chunk-census = ["aft-engine/semantic-chunk-census"]

[dependencies]
aft-tools = { path = "../aft-tools", version = "=0.66.0" }
aft-subc = { path = "../aft-subc", version = "=0.66.0" }
aft-engine = { path = "../aft-engine", version = "=0.66.0" }
aft-base = { path = "../aft-base", version = "0.66.0" }
aft-db = { path = "../aft-db", version = "0.66.0" }
aft-parse = { path = "../aft-parse", version = "0.66.0" }
aft-store = { path = "../aft-store", version = "0.66.0" }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
lsp-types = "0.97"
crossbeam-channel = "0.5"
parking_lot = "0.12"
portable-pty = "0.9"
libc = "0.2"
tree-sitter = "=0.26.7"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
notify = "8"
regex = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
sha2 = { version = "0.10", features = ["compress"] }
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "trace", "functions"] }
aft-tokenizer = { path = "../aft-tokenizer", version = "0.66.0" }
bytes = "1"
futures-util = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli"] }
# Deflate for the call-graph view's per-file JSON payloads. Already in the
# build through async-compression, image and ureq; listed here to call it
# synchronously.
flate2 = "1.1"
# Shared CortexKit-neutral path-canonicalization primitive (ProjectRootId).
# Lives in github.com/cortexkit/commons (product-neutral, used without subc);
# its CI runs the cfg(windows) verbatim/UNC/drive-case vectors continuously.
cortexkit-paths = "0.1"
glob = "0.3"
which = "7"
url = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rayon = "1"
# Verify fleet-served gh routing manifests with a public-key signature before
# they can authorise governed routing.
ring = "0.17"
# We only load tokenizer.json and encode; serde/json support is always-on in
# tokenizers. The pure-Rust fancy-regex backend satisfies tokenizers
# compile-time regex selection without pulling in onig's C library.
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
cortexkit-role-tool-provider = "=0.15.12"
cortexkit-role-llm-runner = "=0.8.53"
cortexkit-role-tool-display = "=0.1.12"
jsonschema = { version = "0.33", default-features = false }
subc-protocol = "=0.37.4"
subc-transport = "=0.18.0"
subc-client-rs = "=0.41.4"
# The one reader of the daemon's launch nonce (pipe first, environment copy
# second). subc-client-rs reads through the same cached accessor, so this pin
# must match the version subc-client-rs depends on.
subc-os = { version = "=0.1.42", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemalloc-ctl = { version = "=0.6.1", features = ["stats"] }
landlock = "=0.4.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
] }

[dev-dependencies]
aft-tools = { path = "../aft-tools", version = "=0.66.0", features = ["test-support"] }
aft-engine = { path = "../aft-engine", version = "=0.66.0", features = ["test-support"] }
aft-base = { path = "../aft-base", version = "0.66.0", features = ["test-support"] }
aft-db = { path = "../aft-db", version = "0.66.0", features = ["test-support"] }
aft-parse = { path = "../aft-parse", version = "0.66.0", features = ["test-support"] }
cortexkit-role-tool-provider-conformance = "=0.15.13"
cortexkit-role-tool-provider = { version = "=0.15.12", features = ["test-vectors"] }
cortexkit-role-harness = "=0.1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
filetime = "0.2"

[target.'cfg(unix)'.dev-dependencies]
subc-daemon = "=0.49.0"
