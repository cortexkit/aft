[package]
name = "aft-store"
version = "0.64.0"
edition = "2024"
description = "On-disk index formats for Agent File Tools"
license = "MIT"
rust-version.workspace = true

[dependencies]
blake3 = "1"
content_inspector = "0.2.4"
flate2 = "1.1"
ignore = "0.4"
regex-syntax = "0.8"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
rayon = "1"
regex = "1"
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
# Stored formats convert between widths constantly; every narrowing must be
# checked, never silently truncated.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
