[package]
name = "aft-base"
version = "0.68.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/cortexkit/aft"
description = "Shared foundation for Agent Foundational Toolkit"
autotests = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aft_views_lazy_benchmark)', 'cfg(aft_fake_lsp_helper)'] }

[features]
test-support = ["dep:filetime", "dep:crc32fast", "dep:subc-transport", "tokio/test-util"]
callgraph-shape-census = []
test-hooks = []
test-timing-hooks = []
secret-test-fake = []

[dependencies]
aft-store = { path = "../aft-store", version = "0.68.0" }
secret-rules = { path = "../secret-rules", version = "0.68.0", package = "aft-secret-rules" }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
portable-pty = "0.9"
libc = "0.2"
getrandom = { version = "0.3", features = ["std"] }
crc32fast = { version = "1", optional = true }
ignore = "0.4"
regex = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
sha2 = { version = "0.10", features = ["compress"] }
blake3 = "1"
rustc-demangle = "0.1"
tempfile = "3"
filetime = { version = "0.2", optional = true }
rusqlite = { version = "0.32", features = ["bundled", "backup", "trace", "functions"] }
zeroize = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli"] }
rcgen = "0.13"
cortexkit-paths = "0.1"
cortexkit-store-types = "=0.2.2"
glob = "0.3"
which = "7"
url = "2"
base64 = "0.22"
memchr = "2"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tower-layer = "0.3"
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.6"
htmd = "0.5.4"
markup5ever_rcdom = "0.38"
cortexkit-role-tool-provider = "=0.15.17"
schemars = "1"
subc-protocol = "=0.37.4"
subc-transport = { version = "=0.18.0", optional = true }
subc-client-rs = "=0.41.4"
subc-jsonc = "=0.1.3"
subc-os = { version = "=0.1.42", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
vt100 = "0.16"
jsonc-parser = { version = "0.33", features = ["cst"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "=0.6.1", features = ["background_threads", "unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = { version = "=0.6.1", features = ["stats"] }
tikv-jemalloc-sys = "=0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_UI_Shell",
] }

[dev-dependencies]
crc32fast = "1"
flate2 = "1.1"
tempfile = "3"
filetime = "0.2"
subc-transport = "=0.18.0"
tokio = { version = "1", features = ["test-util"] }
