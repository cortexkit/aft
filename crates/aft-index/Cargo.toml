[package]
name = "aft-index"
version = "0.66.0"
edition = "2021"
description = "Search indexes and filesystem watchers for Agent Foundational Toolkit"
license = "MIT"
repository = "https://github.com/cortexkit/aft"
rust-version.workspace = true
exclude = ["tests/", "examples/", "src/**/*_tests.rs", "src/**/tests.rs", "src/**/tests/"]
autotests = false

[lints.rust]
# The ignored navigation profile is enabled explicitly for manual measurements.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aft_views_lazy_benchmark)', 'cfg(aft_fake_lsp_helper)'] }

[features]
wasm-grammars = ["tree-sitter/wasm", "dep:wasmtime", "dep:wasmtime-c-api-impl", "aft-parse/wasm-grammars"]
callgraph-shape-census = ["aft-base/callgraph-shape-census", "aft-parse/callgraph-shape-census"]
semantic-chunk-census = []
test-support = ["aft-base/test-support", "aft-db/test-support", "aft-edit/test-support", "aft-parse/test-support", "dep:tempfile", "dep:filetime"]
test-timing-hooks = ["aft-base/test-timing-hooks", "aft-db/test-timing-hooks", "aft-parse/test-timing-hooks"]
test-hooks = ["aft-base/test-hooks", "aft-base/test-support", "aft-db/test-hooks", "aft-db/test-support", "aft-edit/test-hooks", "aft-edit/test-support", "aft-parse/test-hooks", "aft-parse/test-support"]

[dependencies]
aft-base = { path = "../aft-base", version = "0.66.0" }
aft-db = { path = "../aft-db", version = "0.66.0" }
aft-edit = { path = "../aft-edit", version = "0.66.0" }
aft-parse = { path = "../aft-parse", version = "0.66.0" }
aft-store = { path = "../aft-store", version = "0.66.0" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
libc = "0.2"
getrandom = "0.3"
tree-sitter = "=0.26.7"
wasmtime = { version = "=36.0.20", optional = true, default-features = false, features = ["pulley", "parallel-compilation"] }
wasmtime-c-api-impl = { version = "=36.0.20", optional = true, default-features = false }
ignore = "0.4"
notify = "8"
regex = "1"
regex-syntax = "0.8"
tempfile = { version = "3.27.0", optional = true }
filetime = { version = "0.2.29", optional = true }
toml = { version = "0.8", default-features = false, features = ["parse"] }
globset = "0.4"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["compress"] }
crc32fast = "1"
blake3 = "1"
rustc-hash = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup", "trace", "functions"] }
secret-rules = { path = "../secret-rules", version = "0.66.0", package = "aft-secret-rules" }
zeroize = "1"
bytes = "1"
flate2 = "1.1"
url = "2"
content_inspector = "0.2.4"
memchr = "2"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["ndarray", "load-dynamic", "half"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
ndarray = "0.17.2"
half = "2"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
htmd = "0.5.4"
markup5ever_rcdom = "0.38"
subc-protocol = "=0.37.4"
subc-transport = "=0.18.0"
subc-client-rs = "=0.41.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
fsevent-sys = "4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
] }

[dev-dependencies]
aft-base = { path = "../aft-base", version = "0.66.0", features = ["test-support"] }
aft-db = { path = "../aft-db", version = "0.66.0", features = ["test-support"] }
aft-edit = { path = "../aft-edit", version = "0.66.0", features = ["test-support"] }
aft-parse = { path = "../aft-parse", version = "0.66.0", features = ["test-support"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ring = "0.17"
rcgen = "0.13"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
filetime = "0.2"
