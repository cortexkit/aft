[package]
name = "aft-db"
version = "0.66.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/cortexkit/aft"
description = "SQLite stores and access policy for Agent Foundational Toolkit"
autotests = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aft_views_lazy_benchmark)', 'cfg(aft_fake_lsp_helper)'] }

[features]
test-support = ["aft-base/test-support", "dep:tempfile"]
test-hooks = ["aft-base/test-hooks"]
test-timing-hooks = ["aft-base/test-timing-hooks"]

[dependencies]
aft-base = { path = "../aft-base", version = "0.66.0" }
rusqlite = { version = "0.32", features = ["bundled", "backup", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
libc = "0.2"
getrandom = "0.3"
tokio = { version = "1", features = ["sync"] }
blake3 = "1"
parking_lot = "0.12"
globset = "0.4"
ignore = "0.4"
sha2 = { version = "0.10", features = ["compress"] }
subc-protocol = "=0.37.4"
cortexkit-role-tool-provider = "=0.15.12"
tempfile = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
aft-base = { path = "../aft-base", version = "0.66.0", features = ["test-support"] }
aft-store = { path = "../aft-store", version = "0.66.0" }
tempfile = "3"
filetime = "0.2"
