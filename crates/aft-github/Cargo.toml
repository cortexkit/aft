[package]
name = "aft-github"
version = "0.66.0"
edition = "2021"
description = "GitHub reads and governed GitHub shim for Agent Foundational Toolkit"
license = "MIT"
repository = "https://github.com/cortexkit/aft"
rust-version.workspace = true
exclude = ["tests/", "examples/", "src/**/*_tests.rs", "src/**/tests.rs", "src/**/tests/"]
autotests = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aft_views_lazy_benchmark)', 'cfg(aft_fake_lsp_helper)'] }

[features]
test-support = ["aft-base/test-support", "aft-db/test-support", "dep:tempfile"]
test-hooks = []

[dependencies]
aft-base = { path = "../aft-base", version = "0.66.0" }
aft-db = { path = "../aft-db", version = "0.66.0" }
aft-edit = { path = "../aft-edit", version = "0.66.0" }
aft-store = { path = "../aft-store", version = "0.66.0" }
apollo-parser = "0.8.6"
base64 = "0.22"
blake3 = "1"
getrandom = "0.3"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
log = "0.4"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "backup", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.10", features = ["compress"] }
subc-client-rs = "=0.41.4"
subc-protocol = "=0.37.4"
subc-transport = "=0.18.0"
tempfile = { version = "3.27.0", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tree-sitter = "=0.26.7"
tree-sitter-yaml = "0.7"
url = "2"
which = "7"

[dev-dependencies]
aft-base = { path = "../aft-base", version = "0.66.0", features = ["test-support"] }
aft-db = { path = "../aft-db", version = "0.66.0", features = ["test-support"] }
graphql-parser = "0.4.1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
landlock = "=0.4.5"
