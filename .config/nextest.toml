# nextest only drives the integration-test slice of the Rust gate.
# The default gate keeps unit and binary tests on libtest so they do not fan out
# into thousands of short-lived processes; the optional unit nextest lane uses
# the named retry profile below.
[profile.default]
retries = 0
fail-fast = true
# nextest accepts negative integers relative to CPU count. Use "num-cpus - 2"
# so two cores stay free for the fake LSP servers, shell subprocesses, and the
# rest of the workstation while the integration suite fans out.
test-threads = -2

# The gate profile is retry-free by default. Its overrides below are a named,
# dated debt register for timing-sensitive tests that have already been isolated
# and exonerated; adding a new retry requires naming the test and recording why.
[profile.gate]
inherits = "default"
# Ceiling exists to catch true hangs (the 43-minute wedge class), not slow
# tests: storm and external-corpus tests legitimately exceed two minutes under
# box load (observed 130-140s on 2026-08-26), so the kill line stays far above
# the slowest honest run while still bounding a genuine deadlock.
slow-timeout = { period = "60s", terminate-after = 10 }

# Flake observed 2026-08-24: edit_match inline-diagnostics quiescence tests.
[[profile.gate.overrides]]
filter = 'test(/^edit_test::edit_match_(complete_empty_requires_settled_clean_publish|inline_lsp_diagnostics_respects_wait_ms|returns_inline_lsp_diagnostics_when_requested)$/)'
retries = 1

# Flake observed 2026-08-24: lsp_rename rollback on a forced failure.
[[profile.gate.overrides]]
filter = 'test(/^lsp_rename_test::test_rename_rollback_on_failure$/)'
retries = 1

# Flake observed 2026-08-25: safety checkpoint and symlink protection tests.
[[profile.gate.overrides]]
filter = 'test(/^safety_test::(force_restricted_checkpoint_restore_replaces_external_target_symlink|restricted_checkpoint_creation_preserves_external_target_symlink|restricted_checkpoint_creation_preserves_in_root_final_symlink|restricted_checkpoint_creation_rejects_symlinked_parent_escape|restricted_checkpoint_restore_replaces_dangling_symlink|restricted_checkpoint_restore_replaces_in_root_symlink_without_changing_its_target|restricted_undo_preview_and_undo_preserve_symlinked_backup_key|symlink_file_delete_is_rejected_with_project_restriction|symlink_file_delete_is_rejected_without_project_restriction|symlink_to_directory_blocks_recursive_delete|symlink_to_outside_file_blocks_recursive_delete)$/)'
retries = 1

# Flake observed 2026-08-25: protocol checkpoint restore preserves symlinks.
[[profile.gate.overrides]]
filter = 'test(/^checkpoint_metadata_test::checkpoint_restore_preserves_permissions_and_symlinks_through_protocol$/)'
retries = 1

# Flake observed 2026-08-25: standalone NDJSON polling leaves navigation pending.
[[profile.gate.overrides]]
filter = 'test(/^lsp_commands_test::standalone_ndjson_polls_cold_navigation_off_the_input_loop$/)'
retries = 1

# Flake observed 2026-08-26: watcher_filter binary test family.
[[profile.gate.overrides]]
filter = 'binary(=aft) and test(/^watcher_filter_tests::/)'
retries = 1

# Flake observed 2026-08-26: graceful_shutdown binary test family.
[[profile.gate.overrides]]
filter = 'binary(=aft) and test(/^graceful_shutdown_search_index_tests::/)'
retries = 1

# Explicit no-retry guard recorded 2026-08-26 for the storm latency family.
# Storm tests assert production latency bounds. Keep this explicit zero-retry
# guard even if a future named expression is widened; release uses the default
# nextest profile in scripts/rust-test-gate.sh as a second, independent guard.
[[profile.gate.overrides]]
filter = 'test(/^subc_storm_test::/)'
retries = 0

[test-groups]
# These families are process-heavy enough to benefit from their own caps even
# when the wider integration suite runs in parallel.
lsp = { max-threads = 4 }
bash = { max-threads = 4 }
subc = { max-threads = 4 }
# Storm rigs assert absolute wall-clock latencies (bind headroom, readiness
# deadlines) with each rig spawning its own module loop, executor pool, and
# mock embedding backend. Running several concurrently makes them contend with
# each other and fail bounds they meet deterministically in isolation.
storm = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/^lsp_/) or test(/^inspect_(diagnostics|tsconfig_membership)_test::/)'
test-group = 'lsp'

[[profile.default.overrides]]
filter = 'test(/^bash_/) or test(/^subc_bridge_test::subc_bridge_bash_/)'
test-group = 'bash'

[[profile.default.overrides]]
filter = 'test(/^subc_bridge_test::(subc_bridge_(bg_|callgraph_|configure_|core_|duplicate_|failed_|goodbye_|l3_|lossy_|mutating_|new_|principal_|pure_|reliable_|response_|routebind_|semantic_|session_|tool_|untrusted_|watcher_)|subc_rejects_)/)'
test-group = 'subc'

[[profile.default.overrides]]
filter = 'test(/^subc_storm_test::/)'
test-group = 'storm'

# The Windows watch stop/start stress tests keep several threads writing,
# deleting and listing files for 45 seconds each. Run each one with the whole
# thread pool to itself, so that load does not slow down timing-sensitive tests
# running beside it, and the two do not run together either. Every profile
# that inherits from default, including gate (the CI lib shards), applies this.
[[profile.default.overrides]]
filter = 'test(/^(callgraph_store::refresh_worker_tests::stopping_a_readiness_watch|config_live::tests::stopping_a_config_directory_watch)_never_stalls_other_file_io$/)'
threads-required = 'num-test-threads'
# Start these first. Nextest starts tests in order, so a test that needs every
# thread waits until all running tests finish, leaving threads idle. At the
# start of a run every thread is free, so nothing waits.
priority = 100

# One test (about 250 s on macOS and 280 s on Windows CI runners) is longer
# than every other test in its hash shard combined. Started late, it runs on
# alone after the rest finish, so its shard ends minutes after the others.
# Started right after the whole-pool tests above, it overlaps the rest of the
# shard instead.
[[profile.default.overrides]]
filter = 'test(=views::assembly::manifest_incremental::tests::views_incremental_random_sequences_equal_full_rebuild)'
priority = 90

# Unit targets need a hard per-test bound because they previously ran as one
# libtest process: one nonterminating worker hid the test name until CI killed
# the entire job. Four status periods retain useful slow-test diagnostics while
# capping any one test at two minutes.
[profile.unit]
slow-timeout = { period = "30s", terminate-after = 4 }
