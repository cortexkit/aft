name: Release

on:
  push:
    tags:
      - "v*"
  # GitHub schedules run on the default branch (main). Rehearsals share the
  # dispatch build/E2E path; only tag pushes may publish to external services.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  # Include SHA so a retag at a different commit gets its own concurrency
  # group and won't get blocked behind a stuck zombie queued run.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCCACHE_IDLE_TIMEOUT: "0"
  # Tags restore the main baseline without creating tag-private compiler caches.
  SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
jobs:
  # Main CI remains a prerequisite on the exact tagged commit. Its stage
  # binaries keep landing fast; the release-only E2E lanes below test shipped
  # fat-LTO binaries before any publication. There is no CI-gate bypass.
  gate:
    name: CI gate (tests.yml green on this commit)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # v0.62.0/v0.63.3/v0.63.4: 0.3-0.5 min; allow 5 min for API delays.
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Require a green tests.yml run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-ci-gate.sh "$GITHUB_SHA"

  # Every published JS package must build before anything is published.
  # tests.yml builds the packages a test needs but never builds all of them,
  # so this is not a rerun.
  build-js-packages:
    name: Build JS packages
    runs-on: ubuntu-latest
    # v0.62.0/v0.63.3/v0.63.4: 0.4-0.5 min; 5 min includes cold setup.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # Workspace consumers import the bridge's dist/, so it builds first.
      - name: Build all JS packages
        run: |
          bun run --cwd packages/aft-bridge build
          bun run --filter '*' build

  # No needs: waiting for the build fleet would delay cancellation until its
  # slowest job finished. Poll the current attempt so timeouts are caught too.
  # Rehearsals deliberately keep all builds running to report every failure.
  cancel-failed-tag-builds:
    name: Cancel tag run on first build failure
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Windows ARM64 peaked at 100.5 min in v0.62.0 (84.8/50.2 in v0.63.3/4).
    # Outlive its 210-minute build budget, with 10 minutes for polling/setup.
    timeout-minutes: 220
    permissions:
      actions: write
    steps:
      - name: Watch builds and cancel on failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          build_names = {
              "Build JS packages", "Build macOS ARM64", "Build macOS x64",
              "Build Linux ARM64", "Build Linux x64",
              "Build Windows ARM64", "Build Windows x64",
          }
          while True:
              pages = json.loads(subprocess.check_output([
                  "gh", "api", "--paginate", "--slurp",
                  f"repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100",
              ], text=True))
              builds = [job for page in pages for job in page["jobs"] if job["name"] in build_names]
              failed = [job for job in builds if job["status"] == "completed" and job["conclusion"] != "success"]
              if failed:
                  print(f"::error::{failed[0]['name']}: {failed[0]['conclusion']}; cancelling remaining jobs", flush=True)
                  subprocess.run(["gh", "run", "cancel", run_id, "--repo", repo], check=True)
                  break
              if {job["name"] for job in builds if job["status"] == "completed"} == build_names:
                  print("All release builds succeeded")
                  break
              time.sleep(30)
          PY

  publish-crates:
    name: Publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # v0.62.0: 4 min; v0.63.3 reached crates.io's size refusal at 6.1 min.
    # Allow over twice the latter duration for packaging and upload.
    timeout-minutes: 15
    needs:
      - gate
      - build-js-packages
      - build-darwin-arm64
      - build-darwin-x64
      - build-linux-arm64
      - build-linux-x64
      - build-win32-arm64
      - build-win32-x64
      - e2e-darwin-arm64
      - e2e-win32-x64
      - e2e-linux-x64
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      # Sync Cargo.toml version to match the tag. Without this, `cargo publish`
      # tries to publish whatever version is in HEAD's Cargo.toml — which is
      # last-released-version on tag pushes (the tag does NOT carry a separate
      # version commit; release.sh commits the version bump locally, but if
      # someone retags HEAD without running release.sh, Cargo.toml stays
      # stale). Mirrors the same step in publish-npm-platforms.
      - name: Sync versions from tag
        run: node scripts/version-sync.mjs --from-tag

      - name: Publish to crates.io
        # Allow re-runs of the same tag: treat "already exists" as success
        # ONLY if the version we're publishing matches the tag. Otherwise the
        # fallback silently masks the version-mismatch bug (we try to publish
        # vN, it already exists, we say success even though we wanted vN+1).
        #
        # `agent-file-tools` depends on `aft-tokenizer` and `aft-secret-rules`
        # by path; cargo refuses to publish a crate whose path-only dep has no
        # `version =` or isn't on crates.io. All three crates therefore declare
        # versions (synced by version-sync.mjs) and we publish the two leaf
        # crates first so `agent-file-tools` can resolve them on crates.io.
        # scripts/lib/test_native_release_workflow.py fails when a new path
        # dependency is added without a publish line here. The `--no-verify` flag on the
        # tokenizer publish skips the build step (saves ~30s for a leaf crate
        # with no consumers in workspace until `agent-file-tools` resolves it
        # from crates.io after publish settles).
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' crates/aft/Cargo.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME wants $TAG_VERSION but Cargo.toml has $CARGO_VERSION after version-sync. version-sync.mjs broken?"
            exit 1
          fi
          # CRITICAL: use `true` (not `exit 0`) in the success branch of the
          # || fallback. `exit 0` in `||` terminates the WHOLE script, so the
          # second `cargo publish` is skipped silently when the first crate
          # is already published — which is exactly the retag-recovery case
          # this fallback exists for. (Repro: v0.28.1 retag — aft-tokenizer
          # already existed, agent-file-tools never published.)
          cargo publish --package aft-tokenizer \
            || { ec=$?; cargo publish --package aft-tokenizer --dry-run 2>&1 | grep -q "already exists" && true || exit $ec; }
          cargo publish --package aft-secret-rules \
            || { ec=$?; cargo publish --package aft-secret-rules --dry-run 2>&1 | grep -q "already exists" && true || exit $ec; }
          # Wait briefly for the new leaf crate versions to become visible on
          # crates.io's sparse index before publishing `agent-file-tools` —
          # otherwise the verify step in the second publish can race against
          # index propagation and fail with "no matching package found".
          sleep 30
          cargo publish --package agent-file-tools \
            || { ec=$?; cargo publish --package agent-file-tools --dry-run 2>&1 | grep -q "already exists" && true || exit $ec; }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # Builds start alongside the main-CI gate. macOS ARM64, Windows x64 and
  # Linux x64 hand their shipped binaries to release-only E2E, then publication
  # verifies those same bytes. The three cross-built targets retain build-only
  # coverage. No publication can start until all three E2E jobs succeed.
  # Budgets below use recent release durations on the current runner types,
  # rather than the slower macOS GitHub-hosted runners used for v0.62.0.
  # ---------------------------------------------------------------------------
  build-darwin-arm64:
    name: Build macOS ARM64
    # Blacksmith's M4 runner has 24 GB; the shipped-profile library compile
    # peaks near 12 GB and swaps for hours on GitHub's 7 GB macos-26 runner.
    # Temporary until the self-hosted release runner on our own Mac is live.
    runs-on: blacksmith-6vcpu-macos-26
    # v0.63.3/v0.63.4 on Blacksmith: 15.5/16.4 min; over twice the latter.
    timeout-minutes: 45
    outputs:
      rust_version: ${{ steps.bundle.outputs.rust_version }}
    permissions:
      contents: read
      actions: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      # cache-bin: false keeps a cached ~/.cargo/bin from overwriting the fresh
      # cargo shim, as in build-darwin-x64.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-darwin-arm64
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Sync versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version-sync.mjs --from-tag

      - name: Release library codegen (shipped profile)
        run: cargo build --release --lib -p agent-file-tools --timings
      - name: Build
        run: cargo build --release --bin aft -p agent-file-tools --timings
      # Strip BEFORE signing, never after: v0.51.1 shipped a SIGKILL-on-load
      # arm64 binary (#238) because strip ran after signing, and strip's
      # automatic re-sign produced a corrupt signature.
      - name: Strip binary
        run: strip target/release/aft

      # Ad-hoc sign, hard-verify, and execute once. --verify --strict fails on
      # an unsigned or corrupt-signature binary; the --version run proves the
      # exact bytes being published start on macOS.
      - name: Sign, verify, and smoke-test binary
        run: |
          codesign -f -s - target/release/aft
          codesign --verify --strict target/release/aft
          target/release/aft --version

      # Package the split debug info (dSYM) as a sibling release asset, so a
      # stripped binary's samples symbolicate. `ditto` dereferences the
      # `aft.dSYM` symlink cargo emits before zipping, so the asset is
      # self-contained.
      - name: Package dSYM
        run: |
          mkdir -p release-dsym
          ditto target/release/aft.dSYM release-dsym/aft.dSYM
          ditto -c -k --keepParent release-dsym/aft.dSYM release-dsym/aft-darwin-arm64-dsym.zip

      - name: Bundle shipped macOS binary and dSYM
        id: bundle
        run: python3 scripts/native-release-artifact.py pack-binary --archive "$RUNNER_TEMP/release.tar" --dsym release-dsym/aft-darwin-arm64-dsym.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shipped-darwin-arm64-${{ github.sha }}
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: ${{ runner.temp }}/release.tar
          compression-level: 1
          if-no-files-found: error

  build-darwin-x64:
    name: Build macOS x64
    # Same runner as the ARM64 build; see the note there.
    runs-on: blacksmith-6vcpu-macos-26
    # v0.63.3/v0.63.4 on Blacksmith: 15.7/18.3 min; over twice the latter.
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-darwin-x64
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Sync versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version-sync.mjs --from-tag

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Strip binary
        run: strip target/x86_64-apple-darwin/release/aft

      # Sign after the LAST binary mutation and hard-verify: v0.51.1 published
      # this asset with no signature at all (#238 class - cross-compiled x64
      # gets no linker signature and nothing signed it). --verify --strict
      # fails the job on unsigned or corrupt-signature binaries.
      - name: Sign and verify binary
        run: |
          codesign -f -s - target/x86_64-apple-darwin/release/aft
          codesign --verify --strict target/x86_64-apple-darwin/release/aft

      # Package the split debug info (dSYM) as a sibling release asset. The
      # shipped binary is stripped (no symtab), so `sample`/`atos` on a deployed
      # binary would otherwise return nameless offsets. `ditto` dereferences the
      # `aft.dSYM` symlink cargo emits (it points at a hash-named bundle under
      # deps/) and copies it to a canonical `aft.dSYM` before zipping, so the
      # release asset is self-contained and keyed by the binary's UUID.
      - name: Package dSYM
        run: |
          ditto target/x86_64-apple-darwin/release/aft.dSYM release-dsym/aft.dSYM
          ditto -c -k --keepParent release-dsym/aft.dSYM release-dsym/aft-darwin-x64-dsym.zip

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-x64
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: target/x86_64-apple-darwin/release/aft
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-x64-dsym
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: release-dsym/aft-darwin-x64-dsym.zip
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    # v0.62.0/v0.63.3/v0.63.4: 19.9/19.9/27.2 min; over twice the peak.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-linux-arm64
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Sync versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version-sync.mjs --from-tag

      # Prebuilt binary via binstall — `cargo install cross` compiled it from
      # source for 2-3 minutes on every release.
      - name: Install cross
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cross@0.2.5

      # Use gnu target (not musl) so dlopen works for ONNX Runtime loading.
      # musl produces static binaries where dlopen is a stub that always fails.
      - name: Build
        run: cross build --release --target aarch64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: target/aarch64-unknown-linux-gnu/release/aft
          if-no-files-found: error

  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    # v0.62.0/v0.63.3/v0.63.4: 16.0/25.4/22.1 min; over twice the peak.
    timeout-minutes: 60
    outputs:
      rust_version: ${{ steps.bundle.outputs.rust_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-linux-x64
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Sync versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version-sync.mjs --from-tag

      - name: Install cross
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cross@0.2.5

      # Use gnu target (not musl) so dlopen works for ONNX Runtime loading.
      # musl produces static binaries where dlopen is a stub that always fails.
      - name: Build
        run: cross build --release --target x86_64-unknown-linux-gnu

      - name: Bundle shipped Linux binary
        id: bundle
        run: python3 scripts/native-release-artifact.py pack-binary --target x86_64-unknown-linux-gnu --archive "$RUNNER_TEMP/release.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: shipped-linux-x64-${{ github.sha }}
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: ${{ runner.temp }}/release.tar
          compression-level: 1
          if-no-files-found: error

  build-win32-arm64:
    name: Build Windows ARM64
    # v0.28: native ARM64 binary. Host is windows-latest (x64) which
    # cross-compiles to aarch64-pc-windows-msvc via the MSVC ARM64 cross
    # toolchain bundled in the Visual Studio Build Tools on the runner.
    runs-on: windows-latest
    # v0.62.0/v0.63.3/v0.63.4: 100.5/84.8/50.2 min; twice the peak + margin.
    timeout-minutes: 210
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-win32-arm64
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Sync versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version-sync.mjs --from-tag
        shell: pwsh

      - name: Build
        run: cargo build --release --target aarch64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: win32-arm64
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: target/aarch64-pc-windows-msvc/release/aft.exe
          if-no-files-found: error

  build-win32-x64:
    name: Build Windows x64
    runs-on: windows-2022
    # v0.62.0/v0.63.3/v0.63.4: 34.8/48.1/48.7 min; twice the peak + margin.
    timeout-minutes: 100
    outputs:
      rust_version: ${{ steps.bundle.outputs.rust_version }}
    permissions:
      contents: read
      actions: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-win32-x64
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Sync versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version-sync.mjs --from-tag
        shell: pwsh

      - name: Release library codegen (shipped profile)
        run: cargo build --release --lib --target x86_64-pc-windows-msvc -p agent-file-tools --timings
        shell: pwsh
      - name: Build
        run: cargo build --release --bin aft --target x86_64-pc-windows-msvc -p agent-file-tools --timings
        shell: pwsh

      # Execute the exact bytes being published once on Windows.
      - name: Smoke-test binary
        run: target/x86_64-pc-windows-msvc/release/aft.exe --version
        shell: pwsh

      - name: Bundle shipped Windows binary
        id: bundle
        run: python scripts/native-release-artifact.py pack-binary --target x86_64-pc-windows-msvc --archive "$env:RUNNER_TEMP/release.tar"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: shipped-win32-x64-${{ github.sha }}
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: ${{ runner.temp }}/release.tar
          compression-level: 1
          if-no-files-found: error

  # E2E consumers never compile or mutate release binaries. They verify the
  # producer's checksum before and after testing and upload the original bundle
  # only on success. Publication consumes these tested bundles, not build output.
  e2e-darwin-arm64:
    name: Shipped E2E (macOS ARM64)
    needs: build-darwin-arm64
    runs-on: macos-26
    # v0.62.0/v0.63.3/v0.63.4: 2.4/3.0/3.4 min; 10 min covers cold setup.
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.build-darwin-arm64.outputs.rust_version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Sync versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version-sync.mjs --from-tag
      - uses: actions/download-artifact@v4
        with:
          name: shipped-darwin-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/shipped-darwin-arm64
      - name: Verify shipped binary provenance
        run: python3 scripts/native-release-artifact.py unpack-binary --archive "$RUNNER_TEMP/shipped-darwin-arm64/release.tar"
      - name: Verify signature and warm tested binary
        run: |
          codesign --verify --strict target/release/aft
          target/release/aft --version
      - name: Install dependencies and build local plugin
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/aft-bridge build
          bun run --cwd packages/opencode-plugin build
      - name: Run shipped E2E suite
        run: bash tests/macos-e2e/run.sh
        env:
          AFT_BINARY_PATH: ${{ github.workspace }}/target/release/aft
          AFT_PLUGIN_DIST: ${{ github.workspace }}/packages/opencode-plugin/dist
      - name: Verify tested bytes are unchanged
        run: python3 scripts/native-release-artifact.py verify-binary --archive "$RUNNER_TEMP/shipped-darwin-arm64/release.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-darwin-arm64-${{ github.sha }}
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: ${{ runner.temp }}/shipped-darwin-arm64/release.tar
          compression-level: 1
          if-no-files-found: error
      - name: Upload macOS plugin log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-e2e-macos-log-${{ github.run_attempt }}
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: ${{ runner.temp }}/aft-e2e-data/cortexkit/aft/logs/aft-plugin.log
          if-no-files-found: warn

  e2e-win32-x64:
    name: Shipped E2E (Windows x64)
    needs: build-win32-x64
    runs-on: windows-2022
    # v0.62.0/v0.63.3/v0.63.4: 4.8/4.6/4.6 min; twice the peak + margin.
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.build-win32-x64.outputs.rust_version }}
          targets: x86_64-pc-windows-msvc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Sync versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version-sync.mjs --from-tag
      - uses: actions/download-artifact@v4
        with:
          name: shipped-win32-x64-${{ github.sha }}
          path: ${{ runner.temp }}/shipped-win32-x64
      - name: Verify shipped binary provenance
        run: python scripts/native-release-artifact.py unpack-binary --target x86_64-pc-windows-msvc --archive "$env:RUNNER_TEMP/shipped-win32-x64/release.tar"
        shell: pwsh
      - name: Install dependencies and build local plugin
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/aft-bridge build
          bun run --cwd packages/opencode-plugin build
        shell: pwsh
      - name: Run shipped E2E suite
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/windows-e2e/run.ps1
        shell: pwsh
        env:
          AFT_BINARY_PATH: ${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\aft.exe
          AFT_PLUGIN_DIST: ${{ github.workspace }}\packages\opencode-plugin\dist
      - name: Verify tested bytes are unchanged
        run: python scripts/native-release-artifact.py verify-binary --target x86_64-pc-windows-msvc --archive "$env:RUNNER_TEMP/shipped-win32-x64/release.tar"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: tested-win32-x64-${{ github.sha }}
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: ${{ runner.temp }}/shipped-win32-x64/release.tar
          compression-level: 1
          if-no-files-found: error
      - name: Collect Windows plugin log on failure
        if: failure()
        shell: pwsh
        run: |
          $source = Join-Path $env:LOCALAPPDATA "cortexkit\aft\logs\aft-plugin.log"
          if (Test-Path $source) {
            Copy-Item $source "$env:RUNNER_TEMP/aft-plugin.log" -Force
          }
      - name: Upload Windows plugin log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-e2e-windows-log-${{ github.run_attempt }}
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: ${{ runner.temp }}/aft-plugin.log
          if-no-files-found: warn

  e2e-linux-x64:
    name: Shipped E2E (Linux x64 Docker)
    needs: build-linux-x64
    runs-on: ubuntu-latest
    # v0.62.0/v0.63.3/v0.63.4: 2.5/2.7/2.6 min; 10 min covers cold Docker.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.build-linux-x64.outputs.rust_version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Sync versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version-sync.mjs --from-tag
      - uses: actions/download-artifact@v4
        with:
          name: shipped-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/shipped-linux-x64
      - name: Verify shipped binary provenance
        run: python3 scripts/native-release-artifact.py unpack-binary --target x86_64-unknown-linux-gnu --archive "$RUNNER_TEMP/shipped-linux-x64/release.tar"
      - name: Install dependencies and build local plugin
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/aft-bridge build
          bun run --cwd packages/opencode-plugin build
          mkdir -p tests/docker/fixtures/npm-packs
          npm pack ./packages/aft-bridge --pack-destination tests/docker/fixtures/npm-packs
          npm pack ./packages/opencode-plugin --pack-destination tests/docker/fixtures/npm-packs
      - name: Run shipped E2E suite
        env:
          AFT_BINARY_PATH: ${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/aft
        run: |
          cp "$AFT_BINARY_PATH" tests/docker/fixtures/aft-linux-x64
          chmod +x tests/docker/fixtures/aft-linux-x64
          docker build --platform linux/amd64 -t aft-shipped-e2e -f tests/docker/Dockerfile.linux-x64 .
          container=$(docker create aft-shipped-e2e)
          version=$(node -p "require('./packages/opencode-plugin/package.json').version")
          docker cp "$container:/root/.cache/aft/bin/v$version/aft" "$RUNNER_TEMP/image-aft"
          docker rm "$container"
          python3 scripts/native-release-artifact.py verify-binary --target x86_64-unknown-linux-gnu --archive "$RUNNER_TEMP/shipped-linux-x64/release.tar" --binary "$RUNNER_TEMP/image-aft"
          mkdir -p e2e-artifacts/linux
          docker run --rm --platform linux/amd64 --volume "$PWD/e2e-artifacts/linux:/root/.local/share/cortexkit/aft/logs" aft-shipped-e2e
      - name: Verify tested bytes are unchanged
        run: python3 scripts/native-release-artifact.py verify-binary --target x86_64-unknown-linux-gnu --archive "$RUNNER_TEMP/shipped-linux-x64/release.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-linux-x64-${{ github.sha }}
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: ${{ runner.temp }}/shipped-linux-x64/release.tar
          compression-level: 1
          if-no-files-found: error
      - name: Upload Linux plugin log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-e2e-linux-log-${{ github.run_attempt }}
          retention-days: ${{ github.event_name == 'schedule' && 2 || 90 }}
          path: e2e-artifacts/linux/aft-plugin.log
          if-no-files-found: warn

  # Consume the same built/tested bytes as npm publishing, but never use registry
  # credentials or upload externally. The main-CI gate is only for tag releases.
  rehearse-publish:
    name: Rehearse crates.io and npm packaging
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # No rehearsal timing yet: v0.63.4 Linux builds peaked at 27.2 min and
    # v0.62.0 npm took 5.8. Allow over twice their sum for package verification.
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    needs:
      - build-js-packages
      - build-darwin-arm64
      - build-darwin-x64
      - build-linux-arm64
      - build-linux-x64
      - build-win32-arm64
      - build-win32-x64
      - e2e-darwin-arm64
      - e2e-win32-x64
      - e2e-linux-x64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A released main version would make Cargo reject the dry run as already
      # published. Relabel only this checkout, not the built/tested binaries.
      - name: Set an unpublished rehearsal version
        run: |
          version=$(node -p 'const [major, minor, patch] = require("./packages/aft-bridge/package.json").version.split("-")[0].split(".").map(Number); `${major}.${minor}.${patch + 1}-rehearsal.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`')
          node scripts/version-sync.mjs "$version"
          # A fresh runner has no registry index for offline lockfile refresh.
          cargo update -w

      # One multi-package invocation verifies siblings in dependency order using
      # Cargo's local registry overlay, without needing unpublished siblings on
      # crates.io. Stable Cargo >=1.90 supports this selection mode.
      - name: Rehearse crates.io publishing
        run: cargo publish --dry-run --locked --allow-dirty -p aft-tokenizer -p aft-secret-rules -p agent-file-tools

      # Mirrors the inline 10 MiB check in scripts/release.sh (crates.io package
      # sizes). A publish dry run does not enforce the registry's upload limit.
      - name: Check packaged crate sizes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--format-version", "1", "--no-deps",
          ], text=True))
          crate_dir = Path(metadata["target_directory"]) / "package"
          crates = sorted(crate_dir.glob("*.crate"))
          expected = {"aft-tokenizer", "aft-secret-rules", "agent-file-tools"}
          for package in metadata["packages"]:
              if package["name"] in expected:
                  assert crate_dir / f"{package['name']}-{package['version']}.crate" in crates, package["name"]
          assert len(crates) >= len(expected), "missing packaged crates"
          limit = 10 * 1024 * 1024
          for crate in crates:
              size = crate.stat().st_size
              print(f"{crate.name}: {size} bytes ({size / limit:.1%} of 10 MiB)")
              if size >= limit:
                  raise SystemExit(f"::error::{crate.name} must be under {limit} bytes")
          PY

      - name: Download darwin-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: tested-darwin-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-darwin-arm64
      - name: Download darwin-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: darwin-x64
          path: packages/npm/darwin-x64/bin
      - name: Download linux-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: packages/npm/linux-arm64/bin
      - name: Download linux-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: tested-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-linux-x64
      - name: Download win32-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: tested-win32-x64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-win32-x64
      - name: Download win32-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: win32-arm64
          path: packages/npm/win32-arm64/bin
      - name: Verify tested macOS binary for npm
        run: python3 scripts/native-release-artifact.py unpack-published --target aarch64-apple-darwin --archive "$RUNNER_TEMP/tested-darwin-arm64/release.tar" --binary packages/npm/darwin-arm64/bin/aft
      - name: Verify tested Windows binary for npm
        run: python3 scripts/native-release-artifact.py unpack-published --target x86_64-pc-windows-msvc --archive "$RUNNER_TEMP/tested-win32-x64/release.tar" --binary packages/npm/win32-x64/bin/aft.exe
      - name: Verify tested Linux binary for npm
        run: python3 scripts/native-release-artifact.py unpack-published --target x86_64-unknown-linux-gnu --archive "$RUNNER_TEMP/tested-linux-x64/release.tar" --binary packages/npm/linux-x64/bin/aft

      # Both binaries came from the tag path's cross@0.2.5 release builds.
      # readelf is architecture-independent; do not execute ARM64 on this host.
      - name: Audit Linux glibc floor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          floor = (2, 23)
          for platform in ("linux-x64", "linux-arm64"):
              binary = Path("packages/npm") / platform / "bin/aft"
              symbols = subprocess.check_output(["readelf", "--dyn-syms", "--wide", str(binary)], text=True)
              required = set(re.findall(r"@GLIBC_([\w.]+)", "\n".join(line for line in symbols.splitlines() if " UND " in line)))
              if not required:
                  raise SystemExit(f"::error::{platform}: no required GLIBC versions found")
              for version in sorted(required):
                  if not re.fullmatch(r"\d+(?:\.\d+)+", version) or tuple(map(int, version.split("."))) > floor:
                      raise SystemExit(f"::error::{platform} requires GLIBC_{version}, above the glibc 2.23 floor")
              print(f"{platform}: required GLIBC versions {', '.join(sorted(required))}; floor 2.23 passed")
          PY

      - name: Prepare npm packages
        run: |
          chmod +x packages/npm/{darwin-arm64,darwin-x64,linux-arm64,linux-x64}/bin/aft
          node scripts/validate-packages.mjs
          bun install
          bun run --cwd packages/aft-bridge build
          bun run --filter '*' build

      - name: Rehearse every npm package
        run: |
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            npm pack --dry-run "./packages/npm/$platform"
          done
          for package in aft-bridge opencode-plugin pi-plugin aft-cli; do
            npm pack --dry-run "./packages/$package"
          done

      - name: Prepare publication records from the rehearsal candidate
        run: node scripts/release-gate-v049.mjs --prepare --snapshot-dir "${{ runner.temp }}/governed-publication" --candidate
      - name: Verify rehearsal publication gates
        run: node scripts/release-gate-v049.mjs --snapshot-dir "${{ runner.temp }}/governed-publication" --candidate --require-platform-artifacts

  # npm publish runs AFTER github-release so that checksums.sha256 is already
  # available on the GitHub release page when ensureBinary() runs during
  # @cortexkit/aft-opencode@latest install.
  publish-npm:
    name: Publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # v0.62.0 took 5.8 min, but v0.63.4 spent 30-60 s per package in npm's
    # publish and provenance steps across ten packages. Leave room for that.
    timeout-minutes: 30
    needs:
      - gate
      - build-darwin-arm64
      - build-darwin-x64
      - build-linux-arm64
      - build-linux-x64
      - build-win32-arm64
      - build-win32-x64
      - e2e-darwin-arm64
      - e2e-win32-x64
      - e2e-linux-x64
      - github-release
    steps:
      - uses: actions/checkout@v5
        with:
          # The v0.49 release gate proves the surface-manifest source commit is
          # an ancestor of the candidate; a shallow (depth-1) clone makes
          # merge-base fail for every historical commit and the gate
          # fail-closed on a healthy release.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure latest npm (for trusted publishing)
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download darwin-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: tested-darwin-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-darwin-arm64

      - name: Download darwin-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: darwin-x64
          path: packages/npm/darwin-x64/bin

      - name: Download linux-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: packages/npm/linux-arm64/bin

      - name: Download linux-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: tested-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-linux-x64

      - name: Download win32-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: tested-win32-x64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-win32-x64

      - name: Download win32-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: win32-arm64
          path: packages/npm/win32-arm64/bin

      - name: Verify tested macOS binary for npm
        run: python3 scripts/native-release-artifact.py unpack-published --target aarch64-apple-darwin --archive "$RUNNER_TEMP/tested-darwin-arm64/release.tar" --binary packages/npm/darwin-arm64/bin/aft
      - name: Verify tested Windows binary for npm
        run: python3 scripts/native-release-artifact.py unpack-published --target x86_64-pc-windows-msvc --archive "$RUNNER_TEMP/tested-win32-x64/release.tar" --binary packages/npm/win32-x64/bin/aft.exe
      - name: Verify tested Linux binary for npm
        run: python3 scripts/native-release-artifact.py unpack-published --target x86_64-unknown-linux-gnu --archive "$RUNNER_TEMP/tested-linux-x64/release.tar" --binary packages/npm/linux-x64/bin/aft

      - name: Set binary permissions
        run: |
          chmod +x packages/npm/darwin-arm64/bin/aft
          chmod +x packages/npm/darwin-x64/bin/aft
          chmod +x packages/npm/linux-arm64/bin/aft
          chmod +x packages/npm/linux-x64/bin/aft

      - name: Sync versions from tag
        run: node scripts/version-sync.mjs --from-tag

      - name: Validate packages
        run: node scripts/validate-packages.mjs

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build aft-bridge
        run: bun run build
        working-directory: packages/aft-bridge

      - name: Build OpenCode plugin
        run: bun run build
        working-directory: packages/opencode-plugin

      - name: Build Pi plugin
        run: bun run build
        working-directory: packages/pi-plugin

      - name: Build CLI
        run: bun run build
        working-directory: packages/aft-cli

      - name: Fetch final v0.48.1 activation baseline
        run: |
          set -euo pipefail
          # Retry so a brief network failure reaching github.com does not
          # fail the release.
          for attempt in 1 2 3; do
            git fetch --force origin refs/tags/v0.48.1:refs/tags/v0.48.1 && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done

      - name: Prepare publication records from the tagged candidate
        run: node scripts/release-gate-v049.mjs --prepare --snapshot-dir "${{ runner.temp }}/governed-publication" --candidate

      - name: Verify v0.49 artifact and release gates
        run: node scripts/release-gate-v049.mjs --snapshot-dir "${{ runner.temp }}/governed-publication" --candidate --require-platform-artifacts

      - name: Retain governed publication records
        uses: actions/upload-artifact@v4
        with:
          name: governed-publication-${{ github.ref_name }}
          path: ${{ runner.temp }}/governed-publication/*.json
          if-no-files-found: error

      # Uses npm Trusted Publishing (OIDC) — configured per-package on npmjs.com
      - name: Publish platform packages
        run: |
          set -euo pipefail

          publish_or_skip() {
            local pkg_dir="$1"
            local pkg_name
            local version
            pkg_name=$(node -p "require('./${pkg_dir}/package.json').name")
            version=$(node -p "require('./${pkg_dir}/package.json').version")

            if npm view "${pkg_name}@${version}" version >/dev/null 2>&1; then
              echo "::notice::${pkg_name}@${version} already published; skipping"
              return 0
            fi

            npm publish --access public --provenance "$pkg_dir"
          }

          for pkg in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            publish_or_skip "packages/npm/$pkg"
          done

      # aft-bridge MUST publish before the plugins, because @cortexkit/aft-opencode
      # and @cortexkit/aft-pi depend on it. Plugins publish from local builds, so
      # there's no install-time race here, but consumers installing @latest will
      # need aft-bridge resolvable on npm.
      #
      # Tolerate `already published` so a re-run of the same tag (or the
      # initial bootstrap publish that claims the package name with a
      # token before Trusted Publishing is configured) doesn't fail the
      # whole release. Mirrors the crates.io publish step above.
      - name: Publish @cortexkit/aft-bridge
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${VERSION} already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance
        working-directory: packages/aft-bridge

      - name: Publish @cortexkit/aft-opencode
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${VERSION} already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance
        working-directory: packages/opencode-plugin

      - name: Publish @cortexkit/aft-pi
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${VERSION} already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance
        working-directory: packages/pi-plugin

      - name: Publish @cortexkit/aft (unified CLI)
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${VERSION} already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance
        working-directory: packages/aft-cli

  # GitHub release must complete before npm publish so that checksums.sha256
  # is available when freshly-installed @cortexkit/aft-opencode@latest triggers
  # ensureBinary().  crates.io publish is also gated so that a failed crate
  # publish blocks the release — no point shipping binaries if the Rust crate
  # isn't available yet.
  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # v0.62.0: 2.1 min; allow 10 min for sequential asset-upload retries.
    timeout-minutes: 10
    needs:
      - gate
      - build-darwin-arm64
      - build-darwin-x64
      - build-linux-arm64
      - build-linux-x64
      - build-win32-arm64
      - build-win32-x64
      - e2e-darwin-arm64
      - e2e-win32-x64
      - e2e-linux-x64
      - publish-crates
    steps:
      - uses: actions/checkout@v5

      - name: Download tested macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: tested-darwin-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-darwin-arm64
      - name: Download tested Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: tested-win32-x64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-win32-x64
      - name: Download tested Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: tested-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/tested-linux-x64
      - name: Download macOS x64 binary
        uses: actions/download-artifact@v4
        with:
          name: darwin-x64
          path: artifacts/darwin-x64
      - name: Download macOS x64 dSYM
        uses: actions/download-artifact@v4
        with:
          name: darwin-x64-dsym
          path: artifacts/darwin-x64-dsym
      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: artifacts/linux-arm64
      - name: Download Windows ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: win32-arm64
          path: artifacts/win32-arm64

      - name: Verify tested macOS binary for release
        run: python3 scripts/native-release-artifact.py unpack-published --target aarch64-apple-darwin --archive "$RUNNER_TEMP/tested-darwin-arm64/release.tar" --binary release-assets/aft-darwin-arm64 --dsym release-assets/aft-darwin-arm64-dsym.zip
      - name: Verify tested Windows binary for release
        run: python3 scripts/native-release-artifact.py unpack-published --target x86_64-pc-windows-msvc --archive "$RUNNER_TEMP/tested-win32-x64/release.tar" --binary release-assets/aft-win32-x64.exe
      - name: Verify tested Linux binary for release
        run: python3 scripts/native-release-artifact.py unpack-published --target x86_64-unknown-linux-gnu --archive "$RUNNER_TEMP/tested-linux-x64/release.tar" --binary release-assets/aft-linux-x64

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/darwin-x64/aft release-assets/aft-darwin-x64
          cp artifacts/linux-arm64/aft release-assets/aft-linux-arm64
          cp artifacts/win32-arm64/aft.exe release-assets/aft-win32-arm64.exe
          chmod +x release-assets/aft-*
          # Split debug info (dSYM) for the darwin release binaries, so a
          # deployed binary's thread-stack samples symbolicate by name instead
          # of returning nameless offsets. Named aft-<target>-dsym.zip.
          cp artifacts/darwin-x64-dsym/aft-darwin-x64-dsym.zip release-assets/

      # Alpha-distribution asset contract (ck setup / ck upgrade): the installer
      # spec fixes the managed binary name as ck-aft, so the archives are
      # ck-aft-<os>-<arch>.zip with ck-aft (ck-aft.exe on Windows) at the
      # archive root, beside <name>.zip.sha256 holding the shasum -a 256 line
      # for the ZIP bytes. The release inventory gate keys on these exact
      # names. Additive: the bare aft-* binary assets above stay untouched for
      # existing consumers (npm resolver, binary downloader, fleet staging).
      - name: Package alpha distribution zips
        run: |
          cd release-assets
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            mkdir -p "zip-stage-$target"
            cp "aft-$target" "zip-stage-$target/ck-aft"
            chmod +x "zip-stage-$target/ck-aft"
            (cd "zip-stage-$target" && zip -q "../ck-aft-$target.zip" ck-aft)
            rm -rf "zip-stage-$target"
            shasum -a 256 "ck-aft-$target.zip" > "ck-aft-$target.zip.sha256"
          done
          # The installer spells Windows targets windows-<arch>; the bare-binary
          # assets keep their historical win32-<arch> names.
          for arch in arm64 x64; do
            mkdir -p "zip-stage-windows-$arch"
            cp "aft-win32-$arch.exe" "zip-stage-windows-$arch/ck-aft.exe"
            (cd "zip-stage-windows-$arch" && zip -q "../ck-aft-windows-$arch.zip" ck-aft.exe)
            rm -rf "zip-stage-windows-$arch"
            shasum -a 256 "ck-aft-windows-$arch.zip" > "ck-aft-windows-$arch.zip.sha256"
          done
          ls -la ./*.zip ./*.zip.sha256

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum aft-* > checksums.sha256
          cat checksums.sha256

      - name: Verify curated release notes exist
        run: |
          notes_file=".alfonso/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Curated release notes missing: $notes_file"
            echo "Draft them under .alfonso/release-notes/ before tagging the release."
            exit 1
          fi
          echo "Using $notes_file as the release body."
          wc -l "$notes_file"

      # The release is assembled with the gh CLI rather than an upload action:
      # v0.56.2 failed three times in a row inside softprops/action-gh-release,
      # which pushes all 21 assets (~1.1 GB) through parallel streams and
      # surfaces whatever the upload service returns ("Error creating asset
      # temp dir", "Headers Timeout Error") as a job failure, then deletes and
      # re-uploads everything on the next attempt. Here each asset goes up on
      # its own stream with bounded retries, an asset that is already present
      # is replaced only if its size differs, and the draft is published only
      # after the asset set on the server matches the set on disk.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file=".alfonso/release-notes/${TAG}.md"
          if ! gh release view "$TAG" --json id --jq .id >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$notes_file" --verify-tag
          else
            gh release edit "$TAG" --draft --title "$TAG" --notes-file "$notes_file"
          fi

          # name<TAB>size of what the server holds now, so a completed upload
          # from an earlier attempt is kept instead of pushed again.
          server_assets() {
            gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
          }

          for path in release-assets/*; do
            name=$(basename "$path")
            size=$(stat -c %s "$path")
            if server_assets | grep -qx "$(printf '%s\t%s' "$name" "$size")"; then
              echo "present: $name ($size bytes)"
              continue
            fi
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$path" --clobber; then
                echo "uploaded: $name ($size bytes) on attempt $attempt"
                break
              fi
              if [ "$attempt" = 4 ]; then
                echo "::error::upload of $name failed on every attempt"
                exit 1
              fi
              echo "upload of $name failed on attempt $attempt; retrying"
              sleep $((attempt * 15))
            done
          done

          expected=$(find release-assets -mindepth 1 -maxdepth 1 -type f | wc -l)
          actual=$(server_assets | wc -l)
          if [ "$expected" != "$actual" ]; then
            echo "::error::release holds $actual assets, expected $expected"
            server_assets
            exit 1
          fi
          for path in release-assets/*; do
            name=$(basename "$path"); size=$(stat -c %s "$path")
            server_assets | grep -qx "$(printf '%s\t%s' "$name" "$size")" \
              || { echo "::error::size mismatch on server for $name"; exit 1; }
          done

          gh release edit "$TAG" --draft=false
          echo "published $TAG with $actual assets"

  # Announce on Discord after the GitHub release is created.
  #
  # Why this lives here (not in discord-release.yml as `on: release: published`):
  # GitHub Actions intentionally suppresses event-triggered workflow cascades
  # from `GITHUB_TOKEN`-authored events. The release is published above with
  # the default `GITHUB_TOKEN`, so the `release: published` event it emits does
  # not trigger downstream workflows. Inlining the Discord post here is the
  # cleanest fix (vs rotating PATs for release creation).
  #
  # `continue-on-error: true` keeps Discord failures from rolling back a
  # successful release — if the webhook is down, the announcement can be
  # retried via `gh workflow run discord-release.yml ...`.
  discord-announce:
    name: Announce on Discord
    runs-on: ubuntu-latest
    # v0.62.0: 0.2 min; a 5-minute minimum leaves room for webhook delays.
    timeout-minutes: 5
    # MUST wait for BOTH github-release AND publish-npm. Without `publish-npm`
    # the announcement can fire while npm packages are still uploading,
    # leaving users who click the release link unable to install the
    # versions Discord just announced.
    needs:
      - gate
      - github-release
      - publish-npm
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Read curated release notes
        id: notes
        run: |
          notes_file=".alfonso/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::Curated release notes missing: $notes_file"
            exit 1
          fi
          # Use a random delimiter to guard against any string in the notes
          # accidentally matching the heredoc terminator. Also ensure the file
          # ends with a newline so `cat`'s output doesn't glue onto the EOF
          # marker (v0.26.3 release notes had no trailing newline, which
          # produced "Matching delimiter not found" and skipped the Discord
          # announcement entirely).
          eof="EOF_$(openssl rand -hex 12)"
          {
            printf 'body<<%s\n' "$eof"
            cat "$notes_file"
            # Guarantee a newline before the closing delimiter, even if the
            # file itself doesn't end with one.
            printf '\n%s\n' "$eof"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1
        with:
          webhook_url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          # Cortexkit teal — decimal value of #2C4A7C.
          color: "2902140"
          username: "AFT Releases"
          # Reduce h1/h2 headings to fit Discord embed limits comfortably.
          reduce_headings: true
          # Keep PR/issue links — useful context in Discord.
          remove_github_reference_links: false
          footer_title: "Changelog"
          footer_timestamp: true
          release_name: ${{ github.ref_name }}
          release_body: ${{ steps.notes.outputs.body }}
          release_html_url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
