name: Retry crates.io publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing shipped release tag to retry on crates.io (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: crates-retry-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RETRY_TAG: ${{ inputs.tag }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Keep retry tooling separate: old release tags do not contain this helper.
      - uses: actions/checkout@v5
        with:
          path: automation

      - name: Require an existing published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$RETRY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[[:alnum:].-]+)?(\+[[:alnum:].-]+)?$ ]]; then
            echo "::error::Expected a release tag (vX.Y.Z)"
            exit 1
          fi
          if [ "$(gh release view "$RETRY_TAG" --json isDraft --jq '.isDraft')" != false ]; then
            echo "::error::crates.io retry requires an existing published GitHub release for $RETRY_TAG"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release-source

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        working-directory: release-source
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash ../automation/scripts/publish-crates.sh "$RETRY_TAG"
