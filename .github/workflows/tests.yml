name: Tests

# PR-time gate: runs Rust + plugin unit tests, Linux Docker e2e, and Windows e2e
# before merge. Tag pushes go through `release.yml` which independently runs the
# build matrix and publishes — both workflows call the SAME reusable unit-suite
# (`_unit-suite.yml`) and e2e-suite (`_e2e-suite.yml`) so PR-time and
# release-time tests never drift.
#
# IMPORTANT: any change to bridge transport, bash spawning, ONNX install,
# locking, or platform-conditional code paths SHOULD touch the matching
# integration test or e2e scenario in `_e2e-suite.yml`. The Linux harness has
# caught real regressions before; the Windows e2e is here to extend that
# coverage to issue-#26-class Windows-specific bugs (bash timeouts, lock
# recovery, path separators).

on:
  pull_request:
    paths:
      - "crates/**"
      - "packages/**"
      - "tests/**"
      - "scripts/**"
      - "benchmarks/aft-search/**"
      - "docs/**"
      - "ARCHITECTURE.md"
      - "STRUCTURE.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/opencode-version.txt"
      - ".github/workflows/tests.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/_unit-suite.yml"
      - ".github/workflows/_e2e-suite.yml"
      - ".github/workflows/bump-opencode.yml"
      - ".github/workflows/discord-release.yml"
  # No paths filter on push, deliberately. `train/**` branches are the push
  # gate: scripts/train-push.sh pushes a train here, waits for THIS run, and
  # fast-forwards main only when it concludes success. A paths filter would
  # skip the run for a train that happens to touch only unlisted files (a
  # docs-only or workflow-only train is still a train), and a skipped run is
  # not a green run - the watcher would wait for a run that never appears and
  # the train could never land. GitHub applies one paths filter to the whole
  # push event, so main gives up its filter to keep trains unconditional; the
  # pull_request filter above is unchanged.
  push:
    branches:
      - main
      - "train/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch name, tag, or commit SHA)"
        required: false
        type: string

# Cancel in-flight runs for the same PR/branch when a new commit arrives.
# Saves CI minutes and surfaces the latest result faster.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # All unit-level coverage (Linux, macOS, Windows cargo, Windows bash e2e).
  # Defined as a reusable workflow so release.yml shares the exact same
  # workload. PR mode (strict=false): Windows jobs are non-blocking; Linux
  # and macOS still block. See `_unit-suite.yml` for details.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit
    uses: ./.github/workflows/_unit-suite.yml
    # Called workflows do not see the caller's secrets by default; the
    # subc-core fetch needs the CK_CI_APP_* secrets to mint its read token.
    secrets: inherit
    with:
      strict: false

  # ---------------------------------------------------------------------------
  # Linux Docker e2e + Pi RPC e2e + macOS native e2e + Windows native e2e.
  # Reuses the same _e2e-suite.yml that release.yml calls.
  #
  # Runs IN PARALLEL with the unit stage: e2e jobs build their own binaries
  # and consume no unit artifacts, so a `needs: unit` gate only serialized
  # two independent ~19-minute stages (~39 min wall for a ~20 min critical
  # path). The tradeoff — runner minutes spent on e2e when unit fails — is
  # accepted for the wall-clock halving. release.yml keeps its own gating.
  #
  # PR/push e2e builds use the `stage` cargo profile (optimized, no fat LTO):
  # same test coverage, minutes less link time per lane. Tag releases run
  # _e2e-suite.yml with the default `release` profile, so the shipped
  # fat-LTO binary shape is still e2e-tested before publishing.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E
    uses: ./.github/workflows/_e2e-suite.yml
    # The nested e2e-opencode2-linux job reads its own emitted check context
    # (actions/checks read); a called workflow may not exceed the caller's grant.
    permissions:
      contents: read
      actions: read
      checks: read
    with:
      cargo_profile: stage

  search-quality-binary:
    name: Search quality binary (Linux x64)
    # The gate rebuilds from source if artifact production is unavailable.
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: search-quality-release
          cache-on-failure: true
      - name: Build shared release AFT
        run: cargo build --release --locked -p agent-file-tools --bin aft
      - uses: actions/upload-artifact@v4
        with:
          name: search-quality-aft-${{ github.sha }}
          path: target/release/aft
          if-no-files-found: error
          retention-days: 1

  search-quality-gate:
    name: search-quality-gate
    needs: search-quality-binary
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve pinned benchmark imports
        run: scripts/telemetry/imports-resolve.sh --spec .cortexkit/alfonso/drafts/2026-09-09-aft-search-quality-b1-real-query-benchmark-manifest-gate-baseline-and-remeasure.md --snapshot 30d4a64f99b3b15fd88be6cf962fff4b3fe5ea17
      - name: Run harness and mode-selection goldens
        run: |
          scripts/telemetry/cost-gate.sh --search-quality --self-test
          python3 benchmarks/aft-search/ci_quality_mode.py --self-test
      - name: Download the shared release AFT
        id: download-release-aft
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: search-quality-aft-${{ github.sha }}
          path: target/release
      - name: Check the shared release AFT
        id: release-aft
        shell: bash
        run: |
          if [[ -f target/release/aft ]]; then
            chmod +x target/release/aft
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the product binary when the artifact is absent
        if: steps.release-aft.outputs.available != 'true'
        run: cargo build --release --locked -p agent-file-tools --bin aft
      - name: Provision the exact-recall corpus at its pinned commits
        # The only network-enabled step: the gate itself runs offline against
        # these clones and fails corpus_missing if they are absent.
        run: python3 benchmarks/aft-search/provision_corpus.py
      - name: Evaluate committed search-quality reference
        env:
          AFT_SEARCH_NETWORK_POLICY: loopback-only
          AFT_SEARCH_CACHE_DIR: ${{ runner.temp }}/empty-aft-search-cache
          AFT_BINARY_PATH: ${{ github.workspace }}/target/release/aft
        run: |
          # Bootstrap arm: until B0 records the initial reference pair the
          # ordinary evaluate cannot run (a missing reference is never
          # downgraded to verify). Prove the pipeline end to end with the
          # B0-guarded dry run instead and say so loudly; this arm disappears
          # the moment real-query-baseline.json exists.
          if [ ! -f benchmarks/aft-search/real-query-baseline.json ]; then
            echo "::warning title=search-quality-gate bootstrap::reference pair absent; B0 has not recorded it yet - running record-reference --dry-run only"
            scripts/telemetry/cost-gate.sh --search-quality --mode record-reference --dry-run
            exit 0
          fi
          # The diff base is the merge-base with main: on a pull request that is
          # the base branch's tip; on a branch push (train branches, first push of
          # a new branch where event.before is all zeros) it is main itself.
          # A base that cannot be resolved is a gate fault by rule (R43), so it
          # must never be the null sha.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            git fetch --no-tags --depth=1 origin main >/dev/null 2>&1 || true
            base="$(git merge-base origin/main "${{ github.sha }}")"
          fi
          mode="$(python3 benchmarks/aft-search/ci_quality_mode.py --base "$base" --head "${{ github.sha }}")"
          scripts/telemetry/cost-gate.sh --search-quality --mode "$mode" --base-ref "$base" --head "${{ github.sha }}"
      - name: Upload search-quality score and behavior diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-score-${{ github.run_attempt }}
          path: |
            benchmarks/aft-search/.bench/search-quality/score.json
            benchmarks/aft-search/.bench/search-quality/score.diff.txt
          if-no-files-found: warn
          retention-days: 14
