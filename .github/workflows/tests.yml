name: Tests

# PR runs are deliberately light: main requires the merge queue, whose
# merge-group run tests the actual landing candidate with the full suite.
# Heavy jobs inside reusable suites are skipped on PRs so required checks
# pass without running twice; policy, descriptors, formatting and lint still
# catch mistakes early. Main, train and CI-experiment pushes and manual runs
# retain the full suite, with exact-SHA main-push runs serving release evidence.
# Tag pushes go through release.yml, which builds/publishes only after
# release-ci-gate.sh finds a successful Tests main-push run for the exact tagged
# commit and verifies every required job succeeded in that run.
#
# IMPORTANT: any change to bridge transport, bash spawning, ONNX install,
# locking, or platform-conditional code paths SHOULD touch the matching
# integration test or e2e scenario in `_e2e-suite.yml`. The Linux harness has
# caught real regressions before; the Windows e2e is here to extend that
# coverage to Windows-specific process and filesystem bugs (bash timeouts, lock
# recovery, path separators).

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  # Required checks must report even for docs-only or otherwise unlisted files.
  # Side-branch trains and CI experiments still need full push coverage.
  push:
    branches:
      - main
      - "train/**"
      - "ci-speed/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch name, tag, or commit SHA)"
        required: false
        type: string

# Separate merge-queue candidates (each PR plus the PRs ahead of it) need
# independent checks. A newer candidate must not cancel an earlier one's run.
# Main runs are also commit-scoped: publication needs CI evidence for the exact
# final commit being tagged, even if another commit lands while its tests run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'merge_group' || github.ref == 'refs/heads/main') && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

env:
  # Keep the compiler cache server alive between build steps so its final
  # statistics cover the whole job instead of a newly started daemon.
  SCCACHE_IDLE_TIMEOUT: "0"
  # Forks, queues and trial branches read main's compiler cache but never save.
  SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}

jobs:
  landing-policy:
    name: Landing policy
    # The main branch must run Landing policy too: release publication requires
    # every required check to succeed on the exact final commit that landed.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Original PR commit identity and agent attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/landing-policy.py --event "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH"
      - name: Capture exact queue context for removal diagnostics
        if: ${{ always() && github.event_name == 'merge_group' }}
        run: |
          python3 -c 'import json, os, pathlib; group=json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())["merge_group"]; (pathlib.Path(os.environ["RUNNER_TEMP"])/"queue-context.json").write_text(json.dumps({key:group[key] for key in ("base_sha", "head_sha", "head_ref")}))'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'merge_group' }}
        with:
          name: queue-context-${{ github.sha }}
          path: ${{ runner.temp }}/queue-context.json
          if-no-files-found: error
          retention-days: 7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install governed-input validator dependencies
        run: bun install --frozen-lockfile
      - name: Build bridge dependency for workspace imports
        run: bun run --cwd packages/aft-bridge build
      - name: Governed-docs aggregate input validator
        run: |
          git fetch --no-tags origin refs/tags/v0.48.1:refs/tags/v0.48.1
          node scripts/release-gate-v049.mjs --check-inputs

  pr-checks:
    name: PR checks
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Install workspace deps
        run: bun install --frozen-lockfile
      - name: Bun lint
        run: bun run lint
      - name: Build bridge dependency for workspace imports
        run: bun run --cwd packages/aft-bridge build
      - name: Bun typecheck
        run: bun run typecheck
      - name: Source and workflow guards
        run: |
          python3 --version
          python3 scripts/test-ci-rust-quality.py
          python3 -m unittest discover -s scripts/lib -p test_workflow_gates.py -v
          python3 -m unittest discover -s scripts/lib -p test_ci_rustc_cache.py -v
          python3 -m unittest discover -s scripts/lib -p test_rust_gate_collection.py -v
          python3 -m unittest discover -s scripts/lib -p test_ci_macos_integration_archive.py -v
          python3 -m unittest discover -s scripts/lib -p test_ci_windows_probes.py -v
          python3 -m unittest discover -s scripts/lib -p test_cache_write_policy.py -v
          python3 -m unittest discover -s scripts/lib -p test_native_release_artifact.py -v
          python3 -m unittest discover -s scripts/lib -p test_native_release_workflow.py -v
          python3 -m unittest discover -s scripts/lib -p test_merge_queue_workflow.py -v
          python3 -m unittest discover -s scripts/lib -p test_pr_search_descriptor.py -v
          python3 -m unittest discover -s scripts/lib -p test_landing_policy.py -v
          bash scripts/train-push.test.sh
          bash scripts/land-pr.test.sh
          bash scripts/release-ci-gate.test.sh
      - name: Validate publication shapes and release notes
        run: |
          node scripts/validate-packages.mjs
          node scripts/check-release-notes.mjs .alfonso/release-notes/v*.md

  # ---------------------------------------------------------------------------
  # All unit-level coverage (Linux, macOS, Windows cargo, Windows bash e2e),
  # defined as a reusable workflow. Windows bash e2e is continue-on-error;
  # Linux and macOS block. See `_unit-suite.yml`.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit
    uses: ./.github/workflows/_unit-suite.yml

  # ---------------------------------------------------------------------------
  # Linux Docker e2e + Pi RPC e2e + macOS native e2e + Windows native e2e.
  #
  # Runs IN PARALLEL with the unit stage: e2e jobs build their own binaries
  # and consume no unit artifacts, so a `needs: unit` gate only serialized
  # two independent ~19-minute stages (~39 min wall for a ~20 min critical
  # path). The tradeoff — runner minutes spent on e2e when unit fails — is
  # accepted for the wall-clock halving.
  #
  # All refs use the optimized, non-LTO stage profile. The release workflow
  # builds and tests the shipped fat-LTO binaries before it can publish them.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E
    uses: ./.github/workflows/_e2e-suite.yml
    # The nested e2e-opencode2-linux job reads its own emitted check context
    # (actions/checks read); a called workflow may not exceed the caller's grant.
    permissions:
      contents: read
      actions: read
      checks: read
    with:
      cargo_profile: stage

  search-quality-binary:
    name: Search quality binary (Linux x64)
    if: ${{ github.event_name != 'pull_request' }}
    # The gate rebuilds from source if artifact production is unavailable.
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Executables include the commit's build provenance. Never restore a
      # fallback binary from another SHA or compiler, even with identical source.
      - uses: actions/cache/restore@v4
        id: release-binary
        with:
          path: target/release/aft
          key: search-quality-release-bin-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.release-binary.outputs.cache-hit != 'true'
        with:
          shared-key: search-quality-release
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build shared release AFT
        if: steps.release-binary.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p agent-file-tools --bin aft
        env:
          RUSTC_WRAPPER: ${{ github.workspace }}/scripts/ci-rustc-cache.py
      - name: Verify release executable can self-report
        run: target/release/aft --version
      - uses: actions/upload-artifact@v4
        with:
          name: search-quality-aft-${{ github.sha }}
          path: target/release/aft
          if-no-files-found: error
          retention-days: 1

      - name: Save exact release executable on main
        if: ${{ github.ref == 'refs/heads/main' && steps.release-binary.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: target/release/aft
          key: ${{ steps.release-binary.outputs.cache-primary-key }}

  search-quality-gate:
    name: search-quality-gate
    needs: search-quality-binary
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve pinned benchmark imports
        run: scripts/telemetry/imports-resolve.sh --spec .cortexkit/alfonso/drafts/2026-09-09-aft-search-quality-b1-real-query-benchmark-manifest-gate-baseline-and-remeasure.md --snapshot 30d4a64f99b3b15fd88be6cf962fff4b3fe5ea17
      - name: Run harness and mode-selection goldens
        run: |
          scripts/telemetry/cost-gate.sh --search-quality --self-test
          python3 benchmarks/aft-search/ci_quality_mode.py --self-test
      - name: Validate PR search-quality descriptor
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 benchmarks/aft-search/search_quality.py --mode check-descriptor \
            --base-ref "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --branch "$QUALITY_BRANCH"
      - name: Download the shared release AFT
        if: ${{ github.event_name != 'pull_request' }}
        id: download-release-aft
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: search-quality-aft-${{ github.sha }}
          path: target/release
      - name: Check the shared release AFT
        if: ${{ github.event_name != 'pull_request' }}
        id: release-aft
        shell: bash
        run: |
          if [[ -f target/release/aft ]]; then
            chmod +x target/release/aft
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the product binary when the artifact is absent
        if: ${{ github.event_name != 'pull_request' && steps.release-aft.outputs.available != 'true' }}
        run: cargo build --release --locked -p agent-file-tools --bin aft
      - name: Provision search-quality corpora at their pinned commits
        if: ${{ github.event_name != 'pull_request' }}
        # The only network-enabled step: evaluation itself runs offline against
        # these trees and fails with an input fault if either one is absent.
        run: |
          python3 benchmarks/aft-search/provision_corpus.py
          python3 benchmarks/aft-search/provision_evidence.py
      - name: Evaluate committed search-quality reference
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUALITY_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          AFT_SEARCH_NETWORK_POLICY: loopback-only
          AFT_SEARCH_CACHE_DIR: ${{ runner.temp }}/empty-aft-search-cache
          AFT_BINARY_PATH: ${{ github.workspace }}/target/release/aft
        run: |
          # Capture this step from its FIRST line. Two earlier attempts put the
          # capture partway down and the step died above it, leaving an empty
          # artifact and an exit code that reads like a ranking verdict. A
          # redirect here cannot be outrun by whatever fails below it.
          mkdir -p benchmarks/aft-search/.bench/search-quality
          exec > >(tee benchmarks/aft-search/.bench/search-quality/gate.log) 2>&1
          set -x
          # Without an initial reference pair, ordinary evaluation cannot run.
          # The existing dry-run bootstrap checks provisioning without silently
          # downgrading evaluation to verify; it cannot authorize queue landing.
          if [ ! -f benchmarks/aft-search/real-query-baseline.json ]; then
            if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
              echo "::error title=search-quality-gate::queue_reference_missing: record the reference pair before enabling queue landing"
              exit 2
            fi
            echo "::warning title=search-quality-gate bootstrap::reference pair absent; running record-reference --dry-run only"
            scripts/telemetry/cost-gate.sh --search-quality --mode record-reference --dry-run
            exit 0
          fi
          # Queue candidates use their pinned event base. PRs use the event's
          # base branch SHA; ordinary pushes resolve a merge-base with main.
          # An unresolved base is an input fault, never an all-zero SHA.
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            # Main may advance during a speculative build. The event's base and
            # head, not today's main tip, define the candidate being checked.
            if [[ ! "$QUEUE_BASE_SHA" =~ ^[0-9a-f]{40}$ || "$QUEUE_HEAD_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error title=search-quality-gate::invalid pinned merge-group base/head"
              exit 2
            fi
            base="$QUEUE_BASE_SHA"
          elif [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          else
            # actions/checkout fetches only the pushed ref, and a refspec-less
            # `git fetch origin main` writes FETCH_HEAD WITHOUT creating
            # refs/remotes/origin/main - so `merge-base origin/main` had no ref
            # to read and returned empty. Name the destination explicitly, and
            # deepen until the merge-base and both sides of the three-dot diff
            # are present locally.
            git fetch --no-tags --deepen=200 origin +refs/heads/main:refs/remotes/origin/main >/dev/null 2>&1 || true
            base="$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || true)"
            if [ -z "$base" ]; then
              git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main >/dev/null 2>&1 || true
              base="$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || true)"
            fi
          fi
          # An unresolved base is a gate fault, and it must say so by name
          # instead of handing the selector an empty string to fail on.
          if [ -z "$base" ]; then
            echo "::error title=search-quality-gate::could not resolve a merge-base with main for ${{ github.sha }}; the gate cannot classify the diff"
            exit 2
          fi
          # The selector's account of a fault is on its stderr, and a bare
          # command substitution under `bash -e` discards it: the step aborts
          # at this line carrying only the exit code, which is what made three
          # earlier rounds unreadable. Capture both streams and report them.
          mkdir -p benchmarks/aft-search/.bench/search-quality
          set +e
          mode="$(python3 benchmarks/aft-search/ci_quality_mode.py --base "$base" --head "$GITHUB_SHA" 2>benchmarks/aft-search/.bench/search-quality/mode.err)"
          mode_status=$?
          set -e
          echo "search-quality-gate: base=$base head=${{ github.sha }} mode='$mode' selector_exit=$mode_status"
          if [ $mode_status -ne 0 ] || [ -z "$mode" ]; then
            echo "::error title=search-quality-gate::mode selector failed (exit $mode_status): $(cat benchmarks/aft-search/.bench/search-quality/mode.err)"
            cp benchmarks/aft-search/.bench/search-quality/mode.err benchmarks/aft-search/.bench/search-quality/gate.log
            exit 2
          fi
          # The gate's own stderr is the only account of an input fault, and a
          # failed step's log is not always retrievable afterwards. Keep it on
          # disk so the upload below carries it whatever the outcome.
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            python3 scripts/merge-queue-search.py --base "$base" --head "$GITHUB_SHA" \
              --head-ref "$QUEUE_HEAD_REF" --repository "$GITHUB_REPOSITORY" --mode "$mode" \
              --plan-output benchmarks/aft-search/.bench/search-quality/queue-plan.json 2>&1 \
              | tee benchmarks/aft-search/.bench/search-quality/gate.log
          else
            scripts/telemetry/cost-gate.sh --search-quality --mode "$mode" --base-ref "$base" \
              --head "$GITHUB_SHA" --branch "$QUALITY_BRANCH" 2>&1 \
              | tee benchmarks/aft-search/.bench/search-quality/gate.log
          fi
      - name: Upload search-quality score and behavior diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-score-${{ github.run_attempt }}
          path: |
            benchmarks/aft-search/.bench/search-quality/score.json
            benchmarks/aft-search/.bench/search-quality/score.diff.txt
            benchmarks/aft-search/.bench/search-quality/gate.log
            benchmarks/aft-search/.bench/search-quality/queue-plan.json
          if-no-files-found: warn
          retention-days: 14
