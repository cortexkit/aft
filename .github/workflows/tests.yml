name: Tests

# PR-time gate: runs Rust + plugin unit tests, Linux Docker e2e, and Windows e2e
# before merge. Tag pushes go through `release.yml` which independently runs the
# build matrix and publishes — both workflows call the SAME reusable unit-suite
# (`_unit-suite.yml`) and e2e-suite (`_e2e-suite.yml`) so PR-time and
# release-time tests never drift.
#
# IMPORTANT: any change to bridge transport, bash spawning, ONNX install,
# locking, or platform-conditional code paths SHOULD touch the matching
# integration test or e2e scenario in `_e2e-suite.yml`. The Linux harness has
# caught real regressions before; the Windows e2e is here to extend that
# coverage to issue-#26-class Windows-specific bugs (bash timeouts, lock
# recovery, path separators).

on:
  pull_request:
    paths:
      - "crates/**"
      - "packages/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "ARCHITECTURE.md"
      - "STRUCTURE.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/opencode-version.txt"
      - ".github/workflows/tests.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/_unit-suite.yml"
      - ".github/workflows/_e2e-suite.yml"
      - ".github/workflows/bump-opencode.yml"
      - ".github/workflows/discord-release.yml"
  # No paths filter on push, deliberately. `train/**` branches are the push
  # gate: scripts/train-push.sh pushes a train here, waits for THIS run, and
  # fast-forwards main only when it concludes success. A paths filter would
  # skip the run for a train that happens to touch only unlisted files (a
  # docs-only or workflow-only train is still a train), and a skipped run is
  # not a green run - the watcher would wait for a run that never appears and
  # the train could never land. GitHub applies one paths filter to the whole
  # push event, so main gives up its filter to keep trains unconditional; the
  # pull_request filter above is unchanged.
  push:
    branches:
      - main
      - "train/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch name, tag, or commit SHA)"
        required: false
        type: string

# Cancel in-flight runs for the same PR/branch when a new commit arrives.
# Saves CI minutes and surfaces the latest result faster.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # All unit-level coverage (Linux, macOS, Windows cargo, Windows bash e2e).
  # Defined as a reusable workflow so release.yml shares the exact same
  # workload. PR mode (strict=false): Windows jobs are non-blocking; Linux
  # and macOS still block. See `_unit-suite.yml` for details.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit
    uses: ./.github/workflows/_unit-suite.yml
    # Called workflows do not see the caller's secrets by default; the
    # subc-core fetch needs the CK_CI_APP_* secrets to mint its read token.
    secrets: inherit
    with:
      strict: false

  # ---------------------------------------------------------------------------
  # Linux Docker e2e + Pi RPC e2e + macOS native e2e + Windows native e2e.
  # Reuses the same _e2e-suite.yml that release.yml calls.
  #
  # Runs IN PARALLEL with the unit stage: e2e jobs build their own binaries
  # and consume no unit artifacts, so a `needs: unit` gate only serialized
  # two independent ~19-minute stages (~39 min wall for a ~20 min critical
  # path). The tradeoff — runner minutes spent on e2e when unit fails — is
  # accepted for the wall-clock halving. release.yml keeps its own gating.
  #
  # PR/push e2e builds use the `stage` cargo profile (optimized, no fat LTO):
  # same test coverage, minutes less link time per lane. Tag releases run
  # _e2e-suite.yml with the default `release` profile, so the shipped
  # fat-LTO binary shape is still e2e-tested before publishing.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E
    uses: ./.github/workflows/_e2e-suite.yml
    with:
      cargo_profile: stage
