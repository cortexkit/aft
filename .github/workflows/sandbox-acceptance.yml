name: Sandbox acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Sandbox acceptance (Linux bubblewrap)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the sandbox probe tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=5 bubblewrap openssh-client python3
          test -x /usr/bin/python3
      - name: Probe bubblewrap on the stock hosted image
        id: stock-bwrap
        shell: bash
        run: |
          echo "Hosted image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          /usr/bin/bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          if (cd / && LC_ALL=C /usr/bin/bwrap --unshare-user --disable-userns --dev-bind / / -- /usr/bin/true); then
            echo 'Stock bubblewrap works; the enforcing matrix will use the stock settings.'
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            echo "Stock bubblewrap failed with exit $status; the stock Landlock fallback must pass before changing AppArmor."
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify AFT's Landlock fallback on the stock hosted image
        if: steps.stock-bwrap.outputs.active == 'false'
        shell: bash
        run: |
          bash crates/aft/tests/sandbox_acceptance/ci-test.sh \
            cargo test --features test-hooks -p agent-file-tools --test sandbox_acceptance -- \
            stock_landlock_fallback --exact --ignored --nocapture
      - name: Permit user namespaces for the enforcing matrix
        if: steps.stock-bwrap.outputs.active == 'false'
        shell: bash
        run: |
          # Change the restriction only on this disposable hosted VM, after
          # proving the stock fallback and before requiring active bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cd /
          LC_ALL=C /usr/bin/bwrap --unshare-user --disable-userns --dev-bind / / -- /usr/bin/true
      - name: Run the role and credential acceptance matrix
        shell: bash
        run: |
          bash crates/aft/tests/sandbox_acceptance/ci-test.sh \
            cargo test --features test-hooks -p agent-file-tools --test sandbox_acceptance -- role_matrix --ignored --test-threads=1 --nocapture
      - name: Run the governed GitHub read through the native worker jail
        shell: bash
        env:
          AFT_REQUIRE_LANDLOCK: '1'
        run: |
          bash crates/aft/tests/sandbox_acceptance/ci-test.sh \
            cargo test --features test-hooks -p agent-file-tools --test worker_jail -- \
            worker_gh_read_t8_first_bound_read_uses_broker_with_credentials_denied --exact --nocapture
      - name: Run active bubblewrap launcher and engine regressions
        shell: bash
        run: |
          cargo build -p agent-file-tools --features test-timing-hooks --bin aft
          export AFT_TEST_BWRAP_AFT="${CARGO_TARGET_DIR:-$PWD/target}/debug/aft"
          test -x "$AFT_TEST_BWRAP_AFT"
          run_test() { bash crates/aft/tests/sandbox_acceptance/ci-test.sh "$@"; }
          run_test cargo test -p aft-tools --features test-timing-hooks --lib -- bwrap_roles bwrap_core bwrap_failures --nocapture
          run_test cargo test -p aft-engine --features test-hooks --lib -- bwrap_composition --nocapture
          # Expand the cgroup path within the new scope, not in this shell.
          # shellcheck disable=SC2016
          if systemd-run --user --scope --quiet --property=MemoryMax=256M /bin/sh -c '
            group=$(cut -d: -f3 /proc/self/cgroup)
            test "$(cat "/sys/fs/cgroup${group}/memory.max")" = 268435456
          '; then
            run_test cargo test -p aft-engine --features test-hooks --lib -- bwrap_composition_memory_uses_the_real_task_scope --ignored --nocapture
          else
            echo 'No user systemd scope with an effective cgroup memory limit; memory composition case not run.'
          fi

  macos:
    name: Sandbox acceptance (Mac mini Seatbelt)
    runs-on: [self-hosted, mac-mini]
    # MOTOR manages the build fleet that normally shares this host.
    # Each job timeout includes 50 minutes for MOTOR to drain the fleet VMs.
    timeout-minutes: 95
    # The git osxkeychain oracle stays off here (no AFT_REQUIRE_ACCEPTANCE_OSXKEYCHAIN):
    # the runner's processes have no user login session, so the helper sees
    # the System keychain. The security CLI pair still measures the keychain block.
    steps:
      - uses: actions/checkout@v5
        id: checkout
        with:
          persist-credentials: false
      - name: Acquire MOTOR macOS hold
        id: macos-hold
        uses: ./.github/actions/macos-hold
        with:
          phase: acquire
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Require and unlock the Mac mini test keychain
        shell: bash
        run: |
          default=$(security default-keychain -d user)
          default=${default#*\"}
          default=${default%\"}
          if [[ "$default" != /Users/ghrunner/Library/Keychains/ci.keychain-db ]]; then
            echo '::error::The Mac mini runner must use its provisioned ci.keychain as the default keychain.'
            exit 1
          fi
          security unlock-keychain -p "" "$default"
          printf 'AFT_ACCEPTANCE_KEYCHAIN=%s\n' "$default" >> "$GITHUB_ENV"
      - name: Run the role and credential acceptance matrix
        shell: bash
        run: |
          set -euo pipefail
          gh_version=2.105.0
          gh_sha256=2a5d03103ae444927383b93d9ffd65579a26e2eb900ce1cf11f55258d5319ded
          dist="gh_${gh_version}_macOS_arm64"
          install_dir=$(mktemp -d "$RUNNER_TEMP/aft-sandbox-gh.XXXXXX")
          trap 'rm -rf "$install_dir"' EXIT
          archive="$install_dir/$dist.zip"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --proto '=https' --proto-redir '=https' --output "$archive" \
            "https://github.com/cli/cli/releases/download/v${gh_version}/${dist}.zip"
          printf '%s  %s\n' "$gh_sha256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$install_dir"
          export AFT_ACCEPTANCE_GH_BINARY="$install_dir/$dist/bin/gh"
          "$AFT_ACCEPTANCE_GH_BINARY" --version
          bash crates/aft/tests/sandbox_acceptance/ci-test.sh \
            cargo test --features test-hooks -p agent-file-tools --test sandbox_acceptance -- role_matrix --ignored --test-threads=1 --nocapture
      - name: Run the governed GitHub read through the native worker jail
        shell: bash
        run: |
          bash crates/aft/tests/sandbox_acceptance/ci-test.sh \
            cargo test --features test-hooks -p agent-file-tools --test worker_jail -- \
            worker_gh_read_t8_first_bound_read_uses_broker_with_credentials_denied --exact --nocapture
      - name: Clean native test processes
        if: always() && steps.macos-hold.outcome == 'success'
        uses: ./.github/actions/native-ci-state
        with:
          phase: cleanup
      - name: Release MOTOR macOS hold
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/macos-hold
        with:
          phase: release
