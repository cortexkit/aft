name: Unit suite

# Reusable workflow that runs all unit-level coverage (Linux, macOS, Windows
# cargo, Windows bash e2e). The Tests workflow calls it for regular unit
# coverage; rust-pr-advisory.yml calls it to reuse only the macOS and Windows
# Rust shards on Rust-changing pull requests. A release does not run it again:
# release.yml requires the tagged commit's tests.yml run to be green instead,
# with every required check of main (the Windows bash e2e job among them)
# concluded success.
#
# Linux, macOS, and Windows cargo jobs block the caller. The Windows bash e2e
# job is continue-on-error, so it does not fail this suite, but it is a
# required check on main and the release gate requires it to succeed.

on:
  workflow_call:
    inputs:
      pr_platform_advisory:
        description: Run only the macOS and Windows Rust library and integration shards on pull requests
        required: false
        type: boolean
        default: false
      storm_profile_probe:
        description: Compare thin LTO with the normal no-LTO storm lane
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Preserve the compiler cache daemon and its statistics between build steps.
  SCCACHE_IDLE_TIMEOUT: "0"
  # Only main populates the shared compiler baseline; other refs still read it.
  SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
  # Line tables retain named frames for the native backtrace/dSYM probes without
  # the full variable/type debug information that dominates test-harness builds.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ---------------------------------------------------------------------------
  # Rust + plugin unit tests on Linux (fast inner loop)
  #
  # Build the non-watcher inventory once for both integration and unit shards.
  # Serial probes run before upload; watcher and feature-enabled conformance
  # retain their isolated execution. The required check joins every lane.
  # ---------------------------------------------------------------------------
  unit-linux-nextest-archive:
    name: Cargo test archive (Linux)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Refuse dependency paths outside the repository
        run: |
          python3 scripts/check-path-deps.py
          python3 scripts/check-path-deps.py --self-test

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-nextest

      - name: Build nextest archive (Linux Rust suite)
        run: cargo nextest archive --workspace -E '(kind(lib) | kind(bin) | kind(test)) - binary(=watcher_integration)' --archive-file "$LINUX_NEXTEST_ARCHIVE"
        env:
          LINUX_NEXTEST_ARCHIVE: ${{ runner.temp }}/linux-nextest.tar.zst

      - name: Run the serial TLS probe
        run: cargo nextest run --archive-file "$LINUX_NEXTEST_ARCHIVE" --profile gate -E 'kind(lib)' -- platform_verifier_tls_client_subprocess
        env:
          LINUX_NEXTEST_ARCHIVE: ${{ runner.temp }}/linux-nextest.tar.zst

      - name: Run the serial backtrace probe
        run: cargo nextest run --archive-file "$LINUX_NEXTEST_ARCHIVE" --profile gate -E 'kind(lib)' -- panic_hook_preserves_default_backtrace_behavior_and_persists
        env:
          LINUX_NEXTEST_ARCHIVE: ${{ runner.temp }}/linux-nextest.tar.zst

      - name: Prove split Rust test inventory is exact
        run: python3 scripts/rust-test-inventory-proof.py
        env:
          AFT_NEXTEST_ARCHIVE_FILE: ${{ runner.temp }}/linux-nextest.tar.zst
          # Must equal the unit-linux-libtest-shard matrix size.
          AFT_UNIT_PARTITION_COUNT: "3"

      - name: Report nextest archive size
        run: |
          bytes=$(stat -c %s "$LINUX_NEXTEST_ARCHIVE")
          printf 'Linux nextest archive: %.2f MiB (%s bytes)\n' "$(awk "BEGIN { print $bytes / 1048576 }")" "$bytes"
        env:
          LINUX_NEXTEST_ARCHIVE: ${{ runner.temp }}/linux-nextest.tar.zst

      # nextest has already compressed the tarball with zstd.
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: linux-nextest-archive
          path: ${{ runner.temp }}/linux-nextest.tar.zst
          compression-level: 0
          if-no-files-found: error

  unit-linux-summary:
    name: Unit tests (Linux)
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - unit-linux
      - unit-linux-nextest-archive
      - unit-linux-libtest-shard
      - unit-linux-nextest
      - unit-linux-nextest-2
      - unit-linux-nextest-3
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every Linux unit lane
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          lanes = json.loads(os.environ["NEEDS"])
          print({name: lane["result"] for name, lane in lanes.items()})
          raise SystemExit(0 if all(lane["result"] == "success" for lane in lanes.values()) else 1)
          PY

  unit-linux-libtest-shard:
    name: Cargo libtest shard ${{ matrix.shard }}/3 (Linux)
    if: ${{ github.event_name != 'pull_request' }}
    needs: unit-linux-nextest-archive
    # Spawned ck-subc release binaries need glibc 2.39 (Ubuntu 24.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-nextest
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: linux-nextest-archive
          path: ${{ runner.temp }}
          verify-zstd: linux-nextest.tar.zst
      - name: Run Linux unit archive partition
        run: ./scripts/rust-test-gate.sh
        env:
          AFT_GATE_PHASES: lib-shard
          AFT_UNIT_TEST_RUNNER: nextest
          AFT_NEXTEST_PARTITION: hash:${{ matrix.shard }}/3
          AFT_NEXTEST_ARCHIVE_FILE: ${{ runner.temp }}/linux-nextest.tar.zst
          NEXTEST_TEST_THREADS: num-cpus

  unit-linux:
    name: Cargo conformance + Bun tests (Linux)
    if: ${{ github.event_name != 'pull_request' }}
    # ck-subc release binaries need glibc 2.39 (Ubuntu 24.04).
    runs-on: ubuntu-24.04
    # Green runs take 17-24 minutes (library tests, conformance, then the Bun
    # unit suites), so 25 left no margin: a loaded merge-queue run was
    # cancelled while its Bun tests were still passing.
    timeout-minutes: 35
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-nextest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # Fail fast: lint + typecheck are the cheapest checks and the most
      # common push mistakes — surface them in the first minute instead of
      # after a multi-minute cargo build.
      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust CI policy regression tests
        run: python3 scripts/test-ci-rust-quality.py

      - name: Bun lint
        run: bun run lint

      - name: CI workflow and compiler-cache invariant guards
        run: |
          bash scripts/test-ci-sccache-start.sh
          python3 -m unittest discover -s scripts/lib -p test_workflow_gates.py -v
          python3 -m unittest discover -s scripts/lib -p test_ci_rustc_cache.py -v
          python3 -m unittest discover -s scripts/lib -p test_rust_gate_collection.py -v
          python3 -m unittest discover -s scripts/lib -p test_ci_macos_integration_archive.py -v
          python3 -m unittest discover -s scripts/lib -p test_ci_windows_probes.py -v
          python3 -m unittest discover -s scripts/lib -p test_ci_storm_inventory.py -v
          python3 -m unittest discover -s scripts/lib -p test_cache_write_policy.py -v
          python3 -m unittest discover -s scripts/lib -p test_native_release_artifact.py -v
          python3 -m unittest discover -s scripts/lib -p test_native_release_workflow.py -v
      - name: Nightly cost gate measurement checks
        run: |
          python3 scripts/telemetry/test_cpu_precision.py
          python3 scripts/telemetry/test_index_census_slow_lines.py
          scripts/telemetry/cost-gate.sh --self-test
      - name: Merge queue workflow and search contracts
        run: |
          python3 --version
          python3 -m unittest discover -s scripts/lib -p test_merge_queue_workflow.py -v
          python3 -m unittest discover -s scripts/lib -p test_landing_policy.py -v
          bash scripts/land-pr.test.sh
          bash scripts/release-ci-gate.test.sh


      # The publish job refuses a package.json shape this validator rejects,
      # and a shape change lands on main days before anyone tags. Running it
      # here means a train cannot land a shape the release would later refuse
      # (v0.56.0's first publish died on a stale ./tui export pin).
      - name: Validate npm package shapes
        run: node scripts/validate-packages.mjs

      # Same reasoning one step down: release notes land on main in a train,
      # often days before release.sh reads them as the GitHub release body.
      # GitHub renders that body with breaks:true, so a hard-wrapped paragraph
      # ships as ragged short lines (v0.57.1 did). Catch it at train time.
      - name: Validate release-notes rendering
        run: node scripts/check-release-notes.mjs .alfonso/release-notes/v*.md

      - name: Build aft-bridge dist (workspace consumers depend on it)
        run: bun run --cwd packages/aft-bridge build

      - name: Build pi-plugin dist (Pi RPC tests need it)
        # tests/pi-rpc spawns real Pi processes that load
        # packages/pi-plugin/dist/index.js. Build it before bun test recurses
        # into that workspace.
        run: bun run --cwd packages/pi-plugin build

      - name: Bun typecheck
        run: bun run typecheck

      # Validate current source and activation evidence without committing
      # branch-dependent digests. This source-only gate never builds Cargo.
      - name: Publication input gate
        run: |
          set -euo pipefail
          # A runner that briefly cannot reach github.com must not fail the
          # merge-queue group: retry the tag fetch before giving up.
          for attempt in 1 2 3; do
            git fetch --force origin refs/tags/v0.48.1:refs/tags/v0.48.1 && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
          node scripts/release-gate-v049.mjs --check-inputs

      - name: Cargo build (debug — needed by plugin e2e tests)
        run: cargo build -p agent-file-tools

      # release-gate --check-inputs validates JS artifacts without Cargo.
      # This full check also compares the committed hashline schema to its Rust
      # generator, preventing stale native schemas from landing on main while
      # reusing the debug generator already built with the test binaries.
      - name: Native generated-schema byte gate
        run: bun packages/opencode-plugin/scripts/build-tool-schemas.ts --check

      - name: Rust test gate (watcher isolated, feature-enabled conformance)
        run: ./scripts/rust-test-gate.sh
        env:
          # The checked-in profile reserves 2 cores for workstation headroom,
          # which starves ~4-core CI runners. CI runners are otherwise idle,
          # so use every core.
          NEXTEST_TEST_THREADS: "num-cpus"
          # The archive shards own lib, bin and integration tests. Watcher tests
          # stay serialized; conformance enables the test-timing-hooks feature.
          AFT_GATE_PHASES: watcher,conformance
          # The release-storm phase runs in its own parallel job
          # (unit-linux-storm) so its release-profile build is off this
          # job's critical path.
          AFT_GATE_SKIP_RELEASE_STORM: "1"

      # cortexkit/subconscious is public, so the default job-scoped token can
      # read its pinned release assets, including on fork pull requests.
      - name: Fetch pinned subc-core
        id: subc_core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path="$(./scripts/fetch-subc-core.sh)"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Bun test (all packages)
        run: bun run test:unit
        env:
          # Tests don't need real cache locations — keep them out of the runner's
          # ~/.cache to avoid cross-test pollution.
          AFT_CACHE_DIR: ${{ runner.temp }}/aft-cache
          AFT_BINARY_PATH: ${{ github.workspace }}/target/debug/aft
          SUBC_CORE_BIN: ${{ steps.subc_core.outputs.path }}
          SUBC_CORE_WIRE_VERSION: "2"

  plugin-e2e-linux:
    name: Plugin e2e (${{ matrix.suite }}, Linux)
    if: ${{ github.event_name != 'pull_request' }}
    # ck-subc release binaries need glibc 2.39 (Ubuntu 24.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: opencode-ndjson
            package: opencode-plugin
            args: "--path-ignore-patterns '**/subc-parity.e2e.test.ts'"
          - suite: opencode-subc
            package: opencode-plugin
            args: "--test-name-pattern 'subc transport parity sweep'"
          - suite: pi
            package: pi-plugin
            args: ""
          - suite: bridge
            package: aft-bridge
            args: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install search parity dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install workspace deps
        run: bun install --frozen-lockfile
      - name: Build aft-bridge dist
        run: bun run --cwd packages/aft-bridge build
      - name: Build aft before running e2e
        run: cargo build -p agent-file-tools --bin aft
      - name: Fetch pinned subc-core
        id: subc_core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path="$(./scripts/fetch-subc-core.sh)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      # Real process startup, git fixtures and module attachment can exceed Bun's
      # five-second unit default. Individual deadline assertions remain unchanged.
      - name: Run e2e suite
        working-directory: packages/${{ matrix.package }}
        run: time bun test --timeout 30000 src/__tests__/e2e/ ${{ matrix.args }}
        env:
          AFT_CACHE_DIR: ${{ runner.temp }}/aft-cache
          AFT_BINARY_PATH: ${{ github.workspace }}/target/debug/aft
          SUBC_CORE_BIN: ${{ steps.subc_core.outputs.path }}
          SUBC_CORE_WIRE_VERSION: "2"
          AFT_SUBC_E2E_LOG_DIR: ${{ runner.temp }}/aft-subc-e2e-logs
      - name: Upload subc diagnostics on failure
        if: failure()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: subc-e2e-logs-${{ matrix.suite }}-linux
          path: ${{ runner.temp }}/aft-subc-e2e-logs/
          if-no-files-found: ignore
          retention-days: 14

  # Branch protection requires each numbered shard's exact check name. Literal
  # job names let skipped PRs report all nine checks without reserving runners;
  # a skipped matrix does not expand its names. The shared action owns execution.
  unit-linux-nextest:
    name: Cargo integration shard 1/3 (Linux)
    if: ${{ github.event_name != 'pull_request' }}
    needs: unit-linux-nextest-archive
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/integration-shard
        with:
          platform: linux
          shard: "1"

  unit-linux-nextest-2:
    name: Cargo integration shard 2/3 (Linux)
    if: ${{ github.event_name != 'pull_request' }}
    needs: unit-linux-nextest-archive
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/integration-shard
        with:
          platform: linux
          shard: "2"

  unit-linux-nextest-3:
    name: Cargo integration shard 3/3 (Linux)
    if: ${{ github.event_name != 'pull_request' }}
    needs: unit-linux-nextest-archive
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/integration-shard
        with:
          platform: linux
          shard: "3"

  worker-gh-read-landlock:
    name: Worker GitHub reads (required Landlock)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AFT_REQUIRE_LANDLOCK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build real AFT for the worker-read jail gate
        run: cargo build -p agent-file-tools --bin aft
      - name: Run worker broker host policy and rendered socket rule regressions
        run: |
          cargo test -p agent-file-tools --lib -- gh_shim --test-threads=1
          binary_listing="$(cargo test -p agent-file-tools --bin aft -- --list)"
          [[ "$binary_listing" == *"gh_shim_broker_seatbelt_root_uses_the_shared_namespace_definition: test"* ]]
          cargo test -p agent-file-tools --bin aft -- gh_shim_broker_seatbelt_root_uses_the_shared_namespace_definition --test-threads=1
      - name: Require worker-read test inventory and run the native gate
        shell: bash
        run: |
          set -euo pipefail
          unset AFT_TEST_AFT_BINARY NEXTEST_BIN_EXE_aft CARGO_BIN_EXE_aft
          cargo --version
          listing="$(cargo test -p agent-file-tools --test worker_jail -- --list)"
          printf '%s\n' "$listing"
          for test in \
            gh_shim_router_host_read_uses_served_catalog_arguments \
            gh_shim_router_host_lookup_transport_failures_record_their_stage \
            worker_gh_read_revocation_suppresses_reply_to_surviving_observer \
            worker_gh_read_common_git_config_is_write_denied \
            worker_gh_read_t8_first_bound_read_uses_broker_with_credentials_denied \
            worker_gh_read_t8_live_scope_rebind_refuses_before_upstream \
            worker_gh_read_t9_policy_matrix_keeps_repository_and_search_fences \
            worker_gh_read_t10_terminal_revocation_unlinks_endpoint \
            worker_gh_read_t10_retained_descendants_fail_after_end_cancel_timeout_and_restart \
            worker_gh_read_t10_promotion_keeps_the_original_command_grant \
            worker_gh_read_t10_cancel_midflight_terminates_reader_without_output \
            worker_gh_read_t11_cross_command_capability_file_and_socket_isolation \
            worker_gh_read_t12_missing_and_stale_endpoint_fail_without_native_gh \
            worker_gh_read_t12_malformed_peer_reply_and_endpoint_replacement_fail_closed \
            worker_jail_temp_denies_other_task_directory; do
            [[ "$listing" == *"$test: test"* ]] || { printf 'missing native test: %s\n' "$test" >&2; exit 1; }
          done
          cargo test -p agent-file-tools --test worker_jail -- gh_shim_router_host --test-threads=1 --nocapture
          cargo test -p agent-file-tools --test worker_jail -- worker_gh_read --test-threads=1 --nocapture
          cargo test -p agent-file-tools --test worker_jail -- worker_jail_temp_denies_other_task_directory --exact --test-threads=1 --nocapture
          probe_listing="$(cargo test -p agent-file-tools --test sandbox_launch_probe -- --list)"
          [[ "$probe_listing" == *"launcher_closes_late_inherited_listener_above_marker_slots: test"* ]]
          [[ "$probe_listing" == *"launcher_fd_probe_required_mode_cannot_silently_skip: test"* ]]
          [[ "$probe_listing" == *"launcher_failure_marker_cannot_be_forged_by_jailed_exec: test"* ]]
          cargo test -p agent-file-tools --test sandbox_launch_probe -- launcher_closes_late_inherited_listener_above_marker_slots --exact --test-threads=1 --nocapture
          cargo test -p agent-file-tools --test sandbox_launch_probe -- launcher_fd_probe_required_mode_cannot_silently_skip --exact --test-threads=1 --nocapture
          cargo test -p agent-file-tools --test sandbox_launch_probe -- launcher_failure_marker_cannot_be_forged_by_jailed_exec --exact --test-threads=1 --nocapture

  # ---------------------------------------------------------------------------
  # Real-kernel Landlock probes. This stays separate from the general unit lane
  # so a kernel without the required ABI cannot turn sandbox coverage into a
  # collection of silent skips.
  # ---------------------------------------------------------------------------
  sandbox-landlock-probes:
    name: Sandbox real-kernel Landlock probes
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build aft binary for sandbox probes
        run: cargo build -p agent-file-tools --bin aft

      - name: Run sandbox launch probes
        run: cargo test -p agent-file-tools --test sandbox_launch_probe -- --test-threads=1 --nocapture
        env:
          AFT_REQUIRE_LANDLOCK: "1"

      - name: Bash reply timeout contract (test-timing-hooks)
        shell: bash
        run: |
          set -euo pipefail
          cargo --version
          test_name="bash_reply_timing_contract_test::subc_promoted_foreground_is_killed_at_its_timeout"
          if ! listing="$(cargo test --locked -p agent-file-tools --features test-timing-hooks --test integration "$test_name" -- --list 2>&1)"; then
            printf '%s\n' "$listing" >&2
            exit 1
          fi
          printf '%s\n' "$listing"
          if [[ "$listing" != *"$test_name: test"* ]]; then
            printf 'expected test missing from integration inventory: %s\n' "$test_name" >&2
            exit 1
          fi
          cargo test --locked -p agent-file-tools --features test-timing-hooks --test integration "$test_name" -- --exact

  # ---------------------------------------------------------------------------
  # Release-calibrated storm latency on a dedicated free Linux runner. The
  # harness retains opt-level 3 and every absolute bound without paying the
  # shipped binary's fat-LTO link. Delayed bind/read controls must still fail.
  # ---------------------------------------------------------------------------
  unit-linux-storm:
    name: Release storm (Linux)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_CI_STORM_LTO: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-storm-off
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-nextest

      - uses: ./.github/actions/storm-suite

  unit-linux-storm-profile-probe:
    name: Storm profile comparison (thin LTO)
    if: ${{ inputs.storm_profile_probe && github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_CI_STORM_LTO: thin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-storm-thin
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-nextest
      - uses: ./.github/actions/storm-suite

  # ---------------------------------------------------------------------------
  # MSRV floor check (Linux, pinned to the declared rust-version).
  #
  # The locked oxc 0.126 dependency family requires rustc 1.92, so the real
  # floor is set by a transitive dependency, not by AFT's own code. This job
  # pins the toolchain to the declared rust-version and runs `cargo check
  # --locked` so a floor bump in the lockfile fails here with a clear
  # AFT-owned signal instead of a confusing transitive-dependency error on
  # contributor machines. It runs in parallel with the other unit jobs and
  # gates nothing, so it never extends the critical path.
  # ---------------------------------------------------------------------------
  unit-linux-msrv:
    name: MSRV check (rustc 1.92)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.92

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-linux-msrv
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cargo check (locked, MSRV floor)
        run: cargo check --workspace --all-targets --locked

  # ---------------------------------------------------------------------------
  # Rust + plugin tests on macOS
  #
  # These lanes test macOS-specific behavior: FSEvents watcher delivery,
  # /var-to-/private/var canonicalization, broken-symlink fallback,
  # bash_background SIGTERM handling, and Apple Silicon compilation. Linux
  # cannot exercise these paths.
  #
  # Build library, binary, and non-watcher integration archives in parallel,
  # then split them into hash partitions: five for the lib/bin tests and three
  # for the integration tests. The library harness is the dominant link, so it
  # does not share an archive build with other tests. With five lib shards, the
  # slowest one takes about as long as its single longest test (about 4 minutes).
  # Watcher tests stay serial; conformance and Bun tests use their own lane.
  # ---------------------------------------------------------------------------
  unit-macos-nextest-archive:
    name: Cargo test archive (macOS)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: ./.github/actions/setup-nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-macos
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Split compilation as well as archive contents: a nextest filter alone
      # still builds the large lib/bin harnesses owned by the other archive jobs.
      - name: Build nextest archive (macOS integration suite)
        run: python3 scripts/ci-macos-integration-archive.py archive --archive-file "$MACOS_NEXTEST_ARCHIVE"
        env:
          MACOS_NEXTEST_ARCHIVE: ${{ runner.temp }}/macos-nextest.tar.zst

      - name: Capture integration source inventory
        run: python3 scripts/ci-macos-integration-archive.py list --output "$RUNNER_TEMP/macos-integration-inventory.json"

      - name: Capture doctest inventory
        run: cargo test --workspace --doc -- --list > "$RUNNER_TEMP/macos-doctest-inventory.txt" 2>&1
        env:
          CARGO_TERM_COLOR: never

      - name: Report nextest archive size
        run: |
          bytes=$(stat -f %z "$MACOS_NEXTEST_ARCHIVE")
          printf 'macOS nextest archive: %.2f MiB (%s bytes)\n' "$(awk "BEGIN { print $bytes / 1048576 }")" "$bytes"
        env:
          MACOS_NEXTEST_ARCHIVE: ${{ runner.temp }}/macos-nextest.tar.zst

      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: macos-nextest-archive
          path: |
            ${{ runner.temp }}/macos-nextest.tar.zst
            ${{ runner.temp }}/macos-integration-inventory.json
            ${{ runner.temp }}/macos-doctest-inventory.txt
          compression-level: 0
          if-no-files-found: error

  unit-macos-libtest-archive:
    name: Cargo libtest archive (macOS)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    runs-on: macos-26
    # A cold compile of the crate's lib tests takes 19-28 min on these
    # runners, and a slow runner reached 30 min in 2 of 12 recent main runs.
    # The job then shows as cancelled and fails the whole macOS unit suite
    # without any test having run.
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      # Non-incremental Cargo builds default to 16 codegen units. Split the
      # large library harness more finely without changing dependency profiles,
      # debug assertions, unwind behavior, or the backtrace probe's line tables.
      LIBTEST_CARGO_CONFIG: profile.test.package.agent-file-tools.codegen-units=256
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: ./.github/actions/setup-nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-macos
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build nextest archive (macOS lib tests)
        # The selected integration probe makes Cargo build the real aft CLI.
        # Its tests are filtered out; only the library bucket enters this archive.
        run: cargo nextest archive --workspace --lib --test sandbox_launch_probe -E 'kind(lib)' --config "$LIBTEST_CARGO_CONFIG" --timings --archive-file "$MACOS_LIBTEST_ARCHIVE"
        env:
          MACOS_LIBTEST_ARCHIVE: ${{ runner.temp }}/macos-libtest-nextest.tar.zst

      # Keep the build's timing report even when a later step fails; it is the
      # evidence for diagnosing slow archive builds.
      - name: Save libtest build timings
        if: ${{ always() && hashFiles('target/cargo-timings/*.html') != '' }}
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: macos-libtest-timings
          path: target/cargo-timings/
          if-no-files-found: error

      - name: Run the serial backtrace probe with local debug objects
        run: cargo test -p agent-file-tools --lib panic_hook_preserves_default_backtrace_behavior_and_persists --config "$LIBTEST_CARGO_CONFIG"

      - name: Capture lib source inventory
        run: cargo nextest list --workspace --lib --profile gate -T json --cargo-quiet --config "$LIBTEST_CARGO_CONFIG" > "$RUNNER_TEMP/macos-libtest-inventory.json"

      - name: Report macOS libtest archive size
        run: |
          bytes=$(stat -f %z "$MACOS_LIBTEST_ARCHIVE")
          printf 'macOS libtest archive: %.2f MiB (%s bytes)\n' "$(awk "BEGIN { print $bytes / 1048576 }")" "$bytes"
        env:
          MACOS_LIBTEST_ARCHIVE: ${{ runner.temp }}/macos-libtest-nextest.tar.zst

      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: macos-libtest-archive
          path: |
            ${{ runner.temp }}/macos-libtest-nextest.tar.zst
            ${{ runner.temp }}/macos-libtest-inventory.json
          compression-level: 0
          if-no-files-found: error

  unit-macos-bin-archive:
    name: Cargo bin-test archive (macOS)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    runs-on: macos-26
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: ./.github/actions/setup-nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-macos
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build nextest archive (macOS bin tests)
        # Keep the real CLI alongside the binary test harness without compiling
        # the unrelated library harnesses and integration suite.
        run: cargo nextest archive --workspace --bins --test sandbox_launch_probe -E 'kind(bin)' --archive-file "$MACOS_BIN_ARCHIVE"
        env:
          MACOS_BIN_ARCHIVE: ${{ runner.temp }}/macos-bin-nextest.tar.zst

      - name: Capture bin source inventory
        run: cargo nextest list --workspace --bins --profile gate -T json --cargo-quiet > "$RUNNER_TEMP/macos-bin-inventory.json"

      - name: Report macOS bin archive size
        run: |
          bytes=$(stat -f %z "$MACOS_BIN_ARCHIVE")
          printf 'macOS bin archive: %.2f MiB (%s bytes)\n' "$(awk "BEGIN { print $bytes / 1048576 }")" "$bytes"
        env:
          MACOS_BIN_ARCHIVE: ${{ runner.temp }}/macos-bin-nextest.tar.zst

      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: macos-bin-archive
          path: |
            ${{ runner.temp }}/macos-bin-nextest.tar.zst
            ${{ runner.temp }}/macos-bin-inventory.json
          compression-level: 0
          if-no-files-found: error

  unit-macos-inventory-proof:
    name: Prove Rust test inventory (macOS)
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - unit-macos-nextest-archive
      - unit-macos-libtest-archive
      - unit-macos-bin-archive
      - unit-macos-watcher
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-nextest

      - uses: ./.github/actions/download-artifact-retry
        with:
          name: macos-nextest-archive
          path: ${{ runner.temp }}
          verify-zstd: macos-nextest.tar.zst

      - uses: ./.github/actions/download-artifact-retry
        with:
          name: macos-libtest-archive
          path: ${{ runner.temp }}
          verify-zstd: macos-libtest-nextest.tar.zst

      - uses: ./.github/actions/download-artifact-retry
        with:
          name: macos-bin-archive
          path: ${{ runner.temp }}
          verify-zstd: macos-bin-nextest.tar.zst

      - uses: ./.github/actions/download-artifact-retry
        with:
          name: macos-watcher-inventory
          path: ${{ runner.temp }}

      - name: Prove split Rust test inventory and hash partitions are exact
        run: python3 scripts/rust-test-inventory-proof.py
        env:
          AFT_NEXTEST_ARCHIVE_LIB_FILE: ${{ runner.temp }}/macos-libtest-nextest.tar.zst
          AFT_NEXTEST_ARCHIVE_BIN_FILE: ${{ runner.temp }}/macos-bin-nextest.tar.zst
          AFT_NEXTEST_ARCHIVE_INTEGRATION_FILE: ${{ runner.temp }}/macos-nextest.tar.zst
          AFT_NEXTEST_SOURCE_INVENTORY_LIB_FILE: ${{ runner.temp }}/macos-libtest-inventory.json
          AFT_NEXTEST_SOURCE_INVENTORY_BIN_FILE: ${{ runner.temp }}/macos-bin-inventory.json
          AFT_NEXTEST_SOURCE_INVENTORY_INTEGRATION_FILE: ${{ runner.temp }}/macos-integration-inventory.json
          AFT_WATCHER_TEST_INVENTORY_FILE: ${{ runner.temp }}/macos-watcher-inventory.txt
          AFT_DOCTEST_INVENTORY_FILE: ${{ runner.temp }}/macos-doctest-inventory.txt
          # Must equal the unit-macos-libtest-shard matrix size.
          AFT_UNIT_PARTITION_COUNT: "5"

  unit-macos:
    name: Unit tests (macOS)
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - unit-macos-nextest-archive
      - unit-macos-libtest-archive
      - unit-macos-bin-archive
      - unit-macos-inventory-proof
      - unit-macos-libtest-shard
      - unit-macos-nextest
      - unit-macos-nextest-2
      - unit-macos-nextest-3
      - unit-macos-watcher
      - unit-macos-conformance
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every macOS unit lane
        if: always()
        shell: bash
        env:
          ARCHIVE_RESULT: ${{ needs.unit-macos-nextest-archive.result }}
          LIBTEST_ARCHIVE_RESULT: ${{ needs.unit-macos-libtest-archive.result }}
          BIN_ARCHIVE_RESULT: ${{ needs.unit-macos-bin-archive.result }}
          INVENTORY_RESULT: ${{ needs.unit-macos-inventory-proof.result }}
          LIBTEST_RESULT: ${{ needs.unit-macos-libtest-shard.result }}
          INTEGRATION_RESULT: ${{ needs.unit-macos-nextest.result }}
          INTEGRATION_2_RESULT: ${{ needs.unit-macos-nextest-2.result }}
          INTEGRATION_3_RESULT: ${{ needs.unit-macos-nextest-3.result }}
          WATCHER_RESULT: ${{ needs.unit-macos-watcher.result }}
          CONFORMANCE_BUN_RESULT: ${{ needs.unit-macos-conformance.result }}
        run: |
          set -euo pipefail
          for lane in ARCHIVE LIBTEST_ARCHIVE BIN_ARCHIVE INVENTORY LIBTEST INTEGRATION INTEGRATION_2 INTEGRATION_3 WATCHER CONFORMANCE_BUN; do
            result_var="${lane}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" ]]; then
              echo "macOS unit lane $lane concluded $result" >&2
              exit 1
            fi
          done

  unit-macos-nextest:
    name: Cargo integration shard 1/3 (macOS)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    needs: unit-macos-nextest-archive
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/integration-shard
        with:
          platform: macos
          shard: "1"

  unit-macos-nextest-2:
    name: Cargo integration shard 2/3 (macOS)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    needs: unit-macos-nextest-archive
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/integration-shard
        with:
          platform: macos
          shard: "2"

  unit-macos-nextest-3:
    name: Cargo integration shard 3/3 (macOS)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    needs: unit-macos-nextest-archive
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/integration-shard
        with:
          platform: macos
          shard: "3"

  unit-macos-libtest-shard:
    name: Cargo libtest shard ${{ matrix.shard }}/5 (macOS)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    needs:
      - unit-macos-libtest-archive
      - unit-macos-bin-archive
    runs-on: macos-26
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-macos
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-nextest

      - uses: ./.github/actions/download-artifact-retry
        with:
          name: macos-libtest-archive
          path: ${{ runner.temp }}
          verify-zstd: macos-libtest-nextest.tar.zst

      - uses: ./.github/actions/download-artifact-retry
        with:
          name: macos-bin-archive
          path: ${{ runner.temp }}
          verify-zstd: macos-bin-nextest.tar.zst

      - name: Rust libtest shard (nextest archive)
        run: ./scripts/rust-test-gate.sh
        shell: bash
        env:
          AFT_GATE_LOG: ${{ runner.temp }}/macos-libtest-shard-${{ matrix.shard }}.log
          AFT_TEST_DIAG: "1"
          AFT_UNIT_TEST_RUNNER: nextest
          AFT_GATE_PHASES: ${{ matrix.shard == 1 && 'lib,lib-shard' || 'lib-shard' }}
          AFT_NEXTEST_ARCHIVE_FILE: ${{ runner.temp }}/macos-libtest-nextest.tar.zst
          AFT_NEXTEST_ARCHIVE_BIN_FILE: ${{ runner.temp }}/macos-bin-nextest.tar.zst
          AFT_NEXTEST_EXTRACT_TO: ${{ github.workspace }}
          AFT_NEXTEST_PARTITION: hash:${{ matrix.shard }}/5
          AFT_GATE_SKIP_RELEASE_STORM: "1"
          NEXTEST_TEST_THREADS: "num-cpus"

      - name: Upload macOS libtest shard output
        if: always()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: macos-libtest-shard-${{ matrix.shard }}-log
          path: ${{ runner.temp }}/macos-libtest-shard-${{ matrix.shard }}.log
          if-no-files-found: warn

  unit-macos-watcher:
    name: Cargo watcher tests (macOS)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-macos
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-nextest

      - name: Capture watcher inventory for the split proof
        run: cargo test -p agent-file-tools --features test-timing-hooks --test watcher_integration -- --list > "$RUNNER_TEMP/macos-watcher-inventory.txt" 2>&1
        env:
          CARGO_TERM_COLOR: never

      - name: Rust watcher gate (macOS)
        # Keep FSEvents tests serial because they share fixtures and exercise
        # the platform watcher backend that the other shards exclude.
        run: ./scripts/rust-test-gate.sh
        shell: bash
        env:
          AFT_GATE_LOG: ${{ runner.temp }}/macos-watcher.log
          AFT_TEST_DIAG: "1"
          AFT_GATE_PHASES: watcher
          AFT_GATE_SKIP_RELEASE_STORM: "1"

      - name: Upload macOS watcher output
        if: always()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: macos-watcher-log
          path: ${{ runner.temp }}/macos-watcher.log
          if-no-files-found: warn

      - name: Upload macOS watcher inventory
        if: always()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: macos-watcher-inventory
          path: ${{ runner.temp }}/macos-watcher-inventory.txt
          if-no-files-found: warn

  unit-macos-conformance:
    name: Cargo conformance + Bun tests (macOS)
    if: ${{ github.event_name != 'pull_request' }}
    # This runner builds its own binary and consumes no archive artifacts.
    # The summary still requires both conformance and every archive/shard lane.
    runs-on: macos-26
    # 45 minutes: a cold-cache cargo build alone has taken 15 minutes here, and
    # three merge-queue runs hit 30 while their tests were still passing.
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Refuse dependency paths outside the repository
        run: |
          python3 scripts/check-path-deps.py
          python3 scripts/check-path-deps.py --self-test

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - name: Start compiler cache (fall back to uncached)
        shell: bash
        run: bash scripts/ci-sccache-start.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-macos
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-nextest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Bun lint
        run: bun run lint

      - name: Build aft-bridge dist (workspace consumers depend on it)
        run: bun run --cwd packages/aft-bridge build

      - name: Build pi-plugin dist (Pi RPC tests need it)
        run: bun run --cwd packages/pi-plugin build

      - name: Bun typecheck
        run: bun run typecheck

      - name: Cargo build (debug — needed by plugin tests)
        run: cargo build -p agent-file-tools

      - name: Rust conformance gate (macOS)
        run: ./scripts/rust-test-gate.sh
        env:
          AFT_TEST_DIAG: "1"
          AFT_GATE_PHASES: conformance
          AFT_GATE_SKIP_RELEASE_STORM: "1"

      - name: Bash reply timeout contract (test-timing-hooks)
        shell: bash
        run: |
          set -euo pipefail
          cargo --version
          test_name="bash_reply_timing_contract_test::subc_promoted_foreground_is_killed_at_its_timeout"
          if ! listing="$(cargo test --locked -p agent-file-tools --features test-timing-hooks --test integration "$test_name" -- --list 2>&1)"; then
            printf '%s\n' "$listing" >&2
            exit 1
          fi
          printf '%s\n' "$listing"
          if [[ "$listing" != *"$test_name: test"* ]]; then
            printf 'expected test missing from integration inventory: %s\n' "$test_name" >&2
            exit 1
          fi
          cargo test --locked -p agent-file-tools --features test-timing-hooks --test integration "$test_name" -- --exact

      - name: Fetch pinned subc-core
        id: subc_core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path="$(./scripts/fetch-subc-core.sh)"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Bun test (all packages)
        run: bun run test:unit
        env:
          AFT_TEST_NATIVE_FIXTURE_TIMING: "1"
          AFT_CACHE_DIR: ${{ runner.temp }}/aft-cache
          AFT_BINARY_PATH: ${{ github.workspace }}/target/debug/aft
          SUBC_CORE_BIN: ${{ steps.subc_core.outputs.path }}
          SUBC_CORE_WIRE_VERSION: "2"

  # ---------------------------------------------------------------------------
  # Rust unit and integration tests on Windows
  # Catches platform-conditional code paths (#[cfg(target_os = "windows")])
  # and Windows process/path/signal differences. Same suite as Linux but on a
  # real Windows runner — does NOT spin up OpenCode, that's the e2e job.
  #
  # Build the full non-watcher nextest archive once. Integration cases run in
  # three hash partitions and lib/bin cases in six. The lib/bin tests keep
  # every runner thread busy, so their time falls almost in proportion to the
  # shard count. Watcher tests retain their single-threaded libtest execution
  # alongside the conformance gate.
  #
  # These shards cover Windows-only cfg paths and native process/path/signal
  # behavior. Integration tests send filesystem paths in NDJSON requests through
  # serde_json, which escapes Windows backslashes as JSON string content.
  # ---------------------------------------------------------------------------
  unit-windows-nextest-archive:
    name: Cargo test archive (Windows)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/windows-ci-defender

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Both the archive builder and the libtest job use the established
      # unit-windows-cargo cache key. Keeping that key stable preserves the
      # existing hot MSVC dependency cache while the jobs run independently.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-windows-cargo
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-nextest

      - name: Build nextest archive (Windows Rust suite)
        run: cargo nextest archive --workspace -E "(kind(lib) | kind(bin) | kind(test)) - binary(=watcher_integration)" --archive-file "$env:WINDOWS_NEXTEST_ARCHIVE"
        shell: pwsh
        env:
          WINDOWS_NEXTEST_ARCHIVE: ${{ runner.temp }}/windows-nextest.tar.zst

      - uses: actions/setup-python@v6
        with:
          # Python's tarfile can stream the zstd archive metadata from 3.14 on.
          python-version: "3.14"

      # Run the exact archive-built harness while its local PDB still exists.
      # A package-scoped cargo test changes workspace feature unification and
      # recompiles it; direct execution preserves both symbols and build reuse.
      - name: Run the serial TLS probe from the archive build
        run: python scripts/ci-windows-probes.py --archive-file "$env:WINDOWS_NEXTEST_ARCHIVE" --probe tls
        env:
          WINDOWS_NEXTEST_ARCHIVE: ${{ runner.temp }}/windows-nextest.tar.zst

      - name: Run the serial backtrace probe with local PDB
        run: python scripts/ci-windows-probes.py --archive-file "$env:WINDOWS_NEXTEST_ARCHIVE" --probe backtrace
        env:
          WINDOWS_NEXTEST_ARCHIVE: ${{ runner.temp }}/windows-nextest.tar.zst

      - name: Prove split Rust test inventory and hash partitions are exact
        run: python scripts/rust-test-inventory-proof.py
        shell: pwsh
        env:
          AFT_NEXTEST_ARCHIVE_FILE: ${{ runner.temp }}/windows-nextest.tar.zst
          # Must equal the unit-windows-libtest-shard matrix size.
          AFT_UNIT_PARTITION_COUNT: "6"

      - name: Report nextest archive size
        run: |
          $bytes = (Get-Item $env:WINDOWS_NEXTEST_ARCHIVE).Length
          "Windows nextest archive: {0:N2} MiB ({1:N0} bytes)" -f ($bytes / 1MB), $bytes
        shell: pwsh
        env:
          WINDOWS_NEXTEST_ARCHIVE: ${{ runner.temp }}/windows-nextest.tar.zst

      # The archive is already zstd-compressed. Disabling the artifact action's
      # second compression avoids spending CPU to recompress incompressible data.
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: windows-nextest-archive
          path: ${{ runner.temp }}/windows-nextest.tar.zst
          compression-level: 0
          if-no-files-found: error

  unit-windows-libtest:
    name: Cargo libtest + watcher (Windows)
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - unit-windows-nextest-archive
      - unit-windows-libtest-shard
      - unit-windows-watcher
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every Windows libtest lane
        if: always()
        shell: bash
        env:
          ARCHIVE_RESULT: ${{ needs.unit-windows-nextest-archive.result }}
          SHARDS_RESULT: ${{ needs.unit-windows-libtest-shard.result }}
          WATCHER_RESULT: ${{ needs.unit-windows-watcher.result }}
        run: |
          set -euo pipefail
          for lane in ARCHIVE SHARDS WATCHER; do
            result_var="${lane}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" ]]; then
              echo "Windows libtest lane $lane concluded $result" >&2
              exit 1
            fi
          done

  unit-windows-libtest-shard:
    name: Cargo libtest shard ${{ matrix.shard }}/6 (Windows)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    needs: unit-windows-nextest-archive
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/windows-ci-defender

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-windows-cargo
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-nextest

      - uses: ./.github/actions/download-artifact-retry
        with:
          name: windows-nextest-archive
          path: ${{ runner.temp }}
          verify-zstd: windows-nextest.tar.zst

      - name: Rust libtest shard (nextest archive)
        # The gate writes AFT_GATE_LOG itself; do not pipe it through `tee`.
        # On Windows a process a test leaks inherits the write end of every
        # pipe above it, so `tee` never saw end-of-file and the step hung past
        # a fully passing nextest summary until the job timeout.
        run: ./scripts/rust-test-gate.sh
        shell: bash
        env:
          AFT_GATE_LOG: ${{ runner.temp }}/windows-libtest-shard-${{ matrix.shard }}.log
          AFT_TEST_DIAG: "1"
          AFT_UNIT_TEST_RUNNER: nextest
          AFT_GATE_PHASES: lib-shard
          AFT_NEXTEST_ARCHIVE_FILE: ${{ runner.temp }}/windows-nextest.tar.zst
          AFT_NEXTEST_PARTITION: hash:${{ matrix.shard }}/6
          AFT_GATE_SKIP_RELEASE_STORM: "1"
          NEXTEST_TEST_THREADS: "4"

      - name: Upload Windows libtest shard output
        if: always()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: windows-libtest-shard-${{ matrix.shard }}-log
          path: ${{ runner.temp }}/windows-libtest-shard-${{ matrix.shard }}.log
          if-no-files-found: warn

  unit-windows-watcher:
    name: Cargo watcher + conformance (Windows)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/windows-ci-defender

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: unit-windows-cargo
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The gate script checks for cargo-nextest before running any phase.
      - uses: ./.github/actions/setup-nextest

      - name: Rust watcher + conformance gate (Windows)
        # Keep watcher tests serial because they share fixtures. The conformance
        # phase checks the provider contract and four bash-promotion/elicitation
        # cases compiled only with test-timing-hooks.
        run: ./scripts/rust-test-gate.sh
        shell: bash
        env:
          AFT_GATE_LOG: ${{ runner.temp }}/windows-watcher-conformance.log
          AFT_TEST_DIAG: "1"
          AFT_GATE_PHASES: watcher,conformance
          AFT_GATE_SKIP_RELEASE_STORM: "1"

      - name: Upload Windows watcher + conformance output
        if: always()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: windows-watcher-conformance-log
          path: ${{ runner.temp }}/windows-watcher-conformance.log
          if-no-files-found: warn

  unit-windows-cargo:
    name: Cargo integration shard 1/3 (Windows)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    needs: unit-windows-nextest-archive
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/integration-shard
        with:
          platform: windows
          shard: "1"

  unit-windows-cargo-2:
    name: Cargo integration shard 2/3 (Windows)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    needs: unit-windows-nextest-archive
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/integration-shard
        with:
          platform: windows
          shard: "2"

  unit-windows-cargo-3:
    name: Cargo integration shard 3/3 (Windows)
    if: ${{ github.event_name != 'pull_request' || inputs.pr_platform_advisory }}
    needs: unit-windows-nextest-archive
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/integration-shard
        with:
          platform: windows
          shard: "3"
  # ---------------------------------------------------------------------------
  # Cross-target warning gate (Windows, compile-only, DENIES warnings).
  # Split from unit-windows-cargo: with unique RUSTFLAGS it shares no
  # artifacts with the test build, so running it inline added its full
  # duration to the Windows critical path. Catches unix-cfg dead-code
  # warnings the mac/Linux clippy gates structurally cannot see.
  # ---------------------------------------------------------------------------
  unit-windows-check:
    name: Cargo check deny-warnings (Windows)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/windows-ci-defender

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cargo check (deny warnings)
        run: cargo check --workspace --all-targets
        shell: pwsh
        env:
          RUSTFLAGS: "-D warnings"

      - name: Check feature-enabled provider conformance (deny warnings)
        run: cargo check -p agent-file-tools --features test-timing-hooks --test rest
        shell: pwsh
        env:
          RUSTFLAGS: "-D warnings"

  # ---------------------------------------------------------------------------
  # Bash permission flow on Windows
  # Scoped to bash.test.ts only: covers the runAsk + Effect runtime path on
  # Windows for OS-parity peace of mind. The runAsk fix itself is platform-
  # agnostic JavaScript semantics — Linux/macOS in the unit-linux and
  # unit-macos jobs already cover that. This Windows job is intentionally
  # scoped to the bash permission bridge; Rust integration coverage is handled
  # by unit-windows-cargo.
  #
  # Why a real bun runner on Windows: this exercises the BinaryBridge
  # spawning aft.exe over NDJSON via stdio on the Windows process model. It
  # catches a class of bugs that Linux+macOS bun + Windows native E2E miss
  # individually — Effect-runtime semantics under bun's Windows process
  # spawn implementation.
  #
  # Within bash.test.ts, tests asserting Unix-shell OUTPUT SEMANTICS (exact raw
  # byte equality, POSIX `pwd` shape, cat/grep rewrite over forward-slash paths)
  # are skipOnWindows-skipped by design: AFT's hoisted bash runs through
  # PowerShell with backslash Windows paths, those rewrite scenarios are already
  # Unix-only (crates/aft/tests/integration/bash_rewrite_test.rs), and Linux+macOS
  # cover them. The permission-flow tests this job exists for run and gate here.
  #
  # Non-blocking for this suite (continue-on-error), but a required check on
  # main, so a failure still stops a train from landing.
  # ---------------------------------------------------------------------------
  unit-windows-bash:
    name: Bash permission e2e (Windows)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-2022
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/windows-ci-defender

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install workspace deps
        run: bun install --frozen-lockfile
        shell: pwsh

      - name: Build aft-bridge dist (workspace consumers depend on it)
        run: bun run --cwd packages/aft-bridge build

      - name: Build pi-plugin dist (Pi RPC tests need it)
        run: bun run --cwd packages/pi-plugin build
        shell: pwsh

      - name: Cargo build (debug — bash.test.ts spawns the real aft binary)
        run: cargo build -p agent-file-tools
        shell: pwsh

      - name: Bun test (bash permission flow — full bridge + plugin + Rust)
        run: bun test src/__tests__/e2e/bash.test.ts
        working-directory: packages/opencode-plugin
        shell: pwsh
        env:
          AFT_CACHE_DIR: ${{ runner.temp }}/aft-cache
