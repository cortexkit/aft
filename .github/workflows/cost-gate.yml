name: Nightly OSS cost gate

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac mini nightly hardware, or manual-only GitHub-hosted Linux"
        required: false
        default: mac-mini
        type: choice
        options:
          - mac-mini
          - linux
      repo:
        description: "Run one fixed repository (all runs the complete matrix)"
        required: false
        default: all
        type: choice
        options:
          - all
          - redox
          - typescript-eslint
          - jupyterlab
          - hugo
          - synthetic-24k
      write_baseline:
        description: "Capture a fresh baseline, then gate independent passes on the same runner"
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-oss-cost-gate
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Two runs over five repositories can use the full budget without making a
  # single slow repository consume an unbounded scheduled-run allocation.
  AFT_COST_GATE_BUDGET_MIN: "15"
  AFT_COST_GATE_RESULTS_DIR: ${{ github.workspace }}/cost-gate-results

jobs:
  stress-tests:
    name: Full-volume test workloads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      AFT_STRESS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - name: Check CMake for wasm-grammars
        shell: bash
        run: bash scripts/check-cmake.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-stress
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run original stress volumes
        shell: bash
        run: |
          args=(--features wasm-grammars,test-hooks -p agent-file-tools -p aft-engine -p aft-base -p aft-db -p aft-edit -p aft-index -p aft-inspect -p aft-subc --lib --
            views_incremental_random_sequences_equal_full_rebuild
            tool_result_fixtures_release_descriptors
            bash_changed_files_flush_native_no_false_complete_during_50k_activity
            views_shared_checkout_presence_reads_no_payloads
            repeated_worktree_edits_with_periodic_backend_failures_never_repeat_stored_texts
            repeated_worktree_edits_embed_only_new_family_keys_even_after_dropped_admission)
          listing="$(cargo test "${args[@]}" --list)"
          [[ "$listing" == *"bash_changed_files_flush_native_no_false_complete_during_50k_activity: test"* ]] || { echo 'missing changed-files stress test' >&2; exit 1; }
          if [[ "$RUNNER_OS" == Linux ]]; then
            [[ "$listing" == *"subc::tool_result_tests::tool_result_fixtures_release_descriptors: test"* ]] || { echo 'missing aft-subc descriptor stress test' >&2; exit 1; }
          fi
          cargo test "${args[@]}"

  cost-gate:
    name: OSS index cost gate (Mac mini)
    if: ${{ github.event_name == 'schedule' || inputs.runner != 'linux' }}
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      # The Mac mini keeps no Rust on its PATH (the release jobs install theirs
      # the same way). Pin the version so every night measures a binary built
      # by the same compiler; bump it together with a re-recorded baseline.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"

      - name: Check CMake for wasm-grammars
        shell: bash
        run: bash scripts/check-cmake.sh

      - name: Check runner tools
        run: |
          set -euo pipefail
          for tool in cargo rustc cmake python3 git tmutil sysctl sw_vers pmset; do
            command -v "$tool"
          done
          cargo --version
          rustc --version
          cmake --version
          python3 --version

      - name: Set persistent nightly storage outside the checkout
        run: |
          echo "AFT_COST_GATE_RESULTS_DIR=$HOME/aft-nightly-cost/results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      # The runner accepts one GitHub job at a time: a release build delays this
      # job, never overlaps it. MOTOR's separate grant drains its job VMs too.
      - name: Prepare, await MOTOR grant, and measure isolated Mac matrix
        env:
          REPO_INPUT: ${{ inputs.repo }}
          WRITE_BASELINE: ${{ inputs.write_baseline }}
        run: |
          set -euo pipefail
          args=(--repo "${REPO_INPUT:-all}")
          if [[ "${WRITE_BASELINE:-false}" == "true" ]]; then
            args+=(--write-baseline)
          fi
          python3 scripts/telemetry/mac-cost-gate.py "${args[@]}"

      - name: Release nightly hold even after cancellation
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import runpy
          protocol = runpy.run_path('scripts/telemetry/mac-cost-gate.py')
          hold = protocol['HOLD_DIR'] / 'hold.json'
          record = protocol['read_hold_record'](hold)
          if record and record['owner'] == protocol['hold_owner'](os.environ.get('GITHUB_RUN_ID')):
              hold.unlink()
          PY

      - name: Upload Mac cost evidence (including unjudged nights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-cost-gate-mac-mini-${{ github.run_id }}
          path: |
            ${{ env.AFT_COST_GATE_RESULTS_DIR }}/**/*.csv
            ${{ env.AFT_COST_GATE_RESULTS_DIR }}/**/*.md
            ${{ env.AFT_COST_GATE_RESULTS_DIR }}/**/*.log
            ${{ env.AFT_COST_GATE_RESULTS_DIR }}/machine.json
            ${{ env.AFT_COST_GATE_RESULTS_DIR }}/machine-after.json
            ${{ env.AFT_COST_GATE_RESULTS_DIR }}/night-status.json
            ${{ env.AFT_COST_GATE_RESULTS_DIR }}/cost-baselines.candidate.json
          if-no-files-found: warn
          retention-days: 30

  cost-gate-linux:
    name: OSS index cost gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Check CMake for wasm-grammars
        shell: bash
        run: bash scripts/check-cmake.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-cost-gate
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binary
        run: cargo build --features wasm-grammars --release -p agent-file-tools --quiet

      - name: Compare fixed OSS matrix
        env:
          REPO_INPUT: ${{ inputs.repo }}
          WRITE_BASELINE: ${{ inputs.write_baseline }}
          AFT_COST_GATE_CACHE_DIR: ${{ runner.temp }}/aft-cost-gate-cache
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${REPO_INPUT:-}" && "$REPO_INPUT" != "all" ]]; then
            args+=(--repo "$REPO_INPUT")
          fi
          # Peak RSS and CPU seconds belong to the machine that measured them,
          # so a baseline meant to bound this runner has to be captured on it.
          # The regenerated file is uploaded for review rather than committed.
          if [[ "${WRITE_BASELINE:-false}" == "true" ]]; then
            args+=(--write-baseline)
          fi
          scripts/telemetry/cost-gate.sh "${args[@]}"
          if [[ "${WRITE_BASELINE:-false}" == "true" ]]; then
            mkdir -p "$AFT_COST_GATE_RESULTS_DIR"
            cp scripts/telemetry/cost-baselines.json "$AFT_COST_GATE_RESULTS_DIR/cost-baselines.candidate.json"
          fi

      - name: Verify fresh baseline with independent passes
        if: ${{ inputs.write_baseline == true }}
        env:
          REPO_INPUT: ${{ inputs.repo }}
          AFT_COST_GATE_CACHE_DIR: ${{ runner.temp }}/aft-cost-gate-cache
          AFT_COST_GATE_RESULTS_DIR: ${{ github.workspace }}/cost-gate-results/verification
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${REPO_INPUT:-}" && "$REPO_INPUT" != "all" ]]; then
            args+=(--repo "$REPO_INPUT")
          fi
          # Use fresh storage and two new passes, not the observations that
          # defined the baseline. Both captures stay in the uploaded artifact.
          scripts/telemetry/cost-gate.sh "${args[@]}"

      - name: Gate exact lexical recall
        if: ${{ inputs.write_baseline != true }}
        run: |
          python3 benchmarks/aft-search/setup_corpus.py
          scripts/telemetry/cost-gate.sh --exact-recall \
            --binary "${{ github.workspace }}/target/release/aft" \
            --out "$AFT_COST_GATE_RESULTS_DIR/exact-recall.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload cost-gate CSV and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-cost-gate-${{ github.run_id }}
          # Keep measurement evidence, not index payloads or copied executables.
          # The full stores took an hour to fetch and are not used for verdicts.
          path: |
            cost-gate-results/**/*.csv
            cost-gate-results/**/*.md
            cost-gate-results/**/*.log
            cost-gate-results/cost-baselines.candidate.json
            cost-gate-results/exact-recall.json
          if-no-files-found: error
          retention-days: 30
