name: Nightly OSS cost gate

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Run one fixed repository (all runs the complete matrix)"
        required: false
        default: all
        type: choice
        options:
          - all
          - redox
          - typescript-eslint
          - jupyterlab
          - hugo
          - synthetic-24k
      write_baseline:
        description: "Bless this run's numbers: upload a regenerated baseline instead of gating"
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-oss-cost-gate
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Two runs over five repositories can use the full budget without making a
  # single slow repository consume an unbounded scheduled-run allocation.
  AFT_COST_GATE_BUDGET_MIN: "15"
  AFT_COST_GATE_RESULTS_DIR: ${{ github.workspace }}/cost-gate-results

jobs:
  stress-tests:
    name: Full-volume test workloads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      AFT_STRESS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-stress
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run original stress volumes
        shell: bash
        run: >-
          cargo test -p agent-file-tools --lib --
          views_incremental_random_sequences_equal_full_rebuild
          tool_result_fixtures_release_descriptors
          bash_changed_files_flush_native_no_false_complete_during_50k_activity
          views_shared_checkout_presence_reads_no_payloads
          repeated_worktree_edits_with_periodic_backend_failures_never_repeat_stored_texts
          repeated_worktree_edits_embed_only_new_family_keys_even_after_dropped_admission

  cost-gate:
    name: OSS index cost gate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: nightly-cost-gate
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binary
        run: cargo build --release -p agent-file-tools --quiet

      - name: Compare fixed OSS matrix
        env:
          REPO_INPUT: ${{ inputs.repo }}
          WRITE_BASELINE: ${{ inputs.write_baseline }}
          AFT_COST_GATE_CACHE_DIR: ${{ runner.temp }}/aft-cost-gate-cache
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${REPO_INPUT:-}" && "$REPO_INPUT" != "all" ]]; then
            args+=(--repo "$REPO_INPUT")
          fi
          # Peak RSS and CPU seconds belong to the machine that measured them,
          # so a baseline meant to bound this runner has to be captured on it.
          # The regenerated file is uploaded for review rather than committed.
          if [[ "${WRITE_BASELINE:-false}" == "true" ]]; then
            args+=(--write-baseline)
          fi
          scripts/telemetry/cost-gate.sh "${args[@]}"
          if [[ "${WRITE_BASELINE:-false}" == "true" ]]; then
            mkdir -p "$AFT_COST_GATE_RESULTS_DIR"
            cp scripts/telemetry/cost-baselines.json "$AFT_COST_GATE_RESULTS_DIR/cost-baselines.candidate.json"
          fi

      - name: Gate exact lexical recall
        if: ${{ inputs.write_baseline != true }}
        run: |
          python3 benchmarks/aft-search/setup_corpus.py
          scripts/telemetry/cost-gate.sh --exact-recall \
            --binary "${{ github.workspace }}/target/release/aft" \
            --out "$AFT_COST_GATE_RESULTS_DIR/exact-recall.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload cost-gate CSV and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-cost-gate-${{ github.run_id }}
          path: cost-gate-results
          if-no-files-found: error
          retention-days: 30
