# One-off probe for the self-hosted runners: times downloading a 180 MiB
# workflow artifact (GitHub's Azure storage) on narli and on rented-mac, to
# decide whether CI may pass test archives between jobs there.
# Runs only on pushes to ci/narli-probe; delete the branch when done.
name: narli probe

on:
  push:
    branches: ["ci/narli-probe"]

permissions:
  contents: read
  actions: read

jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        runner: [narli, rented-mac]
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Start time
        id: t0
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: macos-libtest-archive
          run-id: 42875717846
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact-probe
      - name: Report download time
        run: |
          set -euo pipefail
          t1=$(date +%s)
          bytes=$(du -sk "$RUNNER_TEMP/artifact-probe" | cut -f1)
          secs=$(( t1 - ${{ steps.t0.outputs.t }} ))
          echo "runner=$RUNNER_NAME kib=$bytes seconds=$secs kib_per_s=$(( bytes / (secs > 0 ? secs : 1) ))"
          rm -rf "$RUNNER_TEMP/artifact-probe"
