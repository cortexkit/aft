name: Validate calibrated storm profile
description: Measure optimized compilation and retain all 19 normal storm cases
runs:
  using: composite
  steps:
    - name: Build calibrated storm harness with compiler timings
      shell: bash
      run: cargo test --profile ci-storm --locked -p agent-file-tools --test integration --no-run --timings

    - name: Require every calibrated storm case
      shell: bash
      run: |
        cargo nextest list --profile default --cargo-profile ci-storm --locked -p agent-file-tools --test integration -E 'test(subc_storm)' -T json > target/storm-inventory.json
        python3 scripts/ci-storm-inventory.py --check-inventory target/storm-inventory.json

    - name: Run all calibrated storm tests
      shell: bash
      run: cargo nextest run --no-fail-fast --profile default --cargo-profile ci-storm --locked -p agent-file-tools --test integration -E 'test(subc_storm)'

    - name: Retain storm compiler timings and inventory
      if: always()
      uses: ./.github/actions/upload-artifact-retry
      with:
        name: storm-profile-${{ env.CARGO_PROFILE_CI_STORM_LTO }}-${{ github.run_attempt }}
        path: |
          target/cargo-timings/
          target/storm-inventory.json
        if-no-files-found: error
